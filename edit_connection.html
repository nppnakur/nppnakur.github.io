<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Connection - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; }

        body {
            background: #fdfaf4;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }

        .main-card {
            width: 100%;
            max-width: 850px;
            height: 96vh;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .header h1 { font-size: 22px; color: #ff8c00; font-weight: 700; }
        
        .back-btn {
            width: 40px; height: 40px;
            background: #eee;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            text-decoration: none;
        }

        .edit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; font-weight: 600; color: #ff8c00; text-transform: uppercase; }
        
        .input-group input {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            font-size: 15px;
            font-weight: 600;
            color: #222;
            outline: none;
        }
        .input-group input:focus { border-color: #ff8c00; background: #fff; }

        /* मनी सेक्शन - बोल्ड लेबल्स */
        .calc-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            background: #fff8f0;
            border-radius: 15px;
            border: 1px dashed #ff8c00;
        }

        .money-card { background: white; padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .money-card label { 
            font-size: 13px; 
            display: block; 
            margin-bottom: 5px; 
            color: #333; 
            font-weight: 800; /* Bold Label */
        }
        .money-card input { width: 100%; border: none; text-align: center; font-size: 18px; font-weight: 700; color: #ff8c00; background: transparent; outline: none; }

        .total-box { background: #ff8c00; border: none; }
        .total-box label { color: white; font-weight: 800; }
        .total-box input { color: white !important; cursor: default; }

        .action-btns {
            display: flex;
            justify-content: center;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-save {
            background: #ff8c00;
            color: #fff;
            padding: 15px 60px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-save:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3); }

        @media (max-width: 600px) {
            .edit-grid { grid-template-columns: 1fr; gap: 10px; }
            .calc-section { grid-template-columns: repeat(3, 1fr); padding: 8px; }
            .money-card input { font-size: 14px; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <h1><i class="fas fa-edit"></i> डेटा संशोधित करें</h1>
            <a href="connection_detail.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        </header>

        <div class="edit-grid">
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>कनेक्शन आईडी</label>
                <input type="text" id="edit_id" placeholder="NPPNCN-0000">
            </div>
            
            <div class="input-group">
                <label>उपभोक्ता का नाम</label>
                <input type="text" id="edit_name">
            </div>
            
            <div class="input-group">
                <label>वार्ड</label>
                <input type="text" id="edit_ward">
            </div>
            
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>मोबाइल नंबर</label>
                <input type="text" id="edit_mobile">
            </div>

            <div class="calc-section">
                <div class="money-card">
                    <label>मांग</label>
                    <input type="number" id="edit_curr" oninput="calculate()">
                </div>
                <div class="money-card">
                    <label>बकाया</label>
                    <input type="number" id="edit_arr" oninput="calculate()">
                </div>
                <div class="money-card total-box">
                    <label>कुल देय</label>
                    <input type="number" id="edit_total" readonly>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-save" onclick="handleSave()">
                <i class="fas fa-save"></i> UPDATE DATA
            </button>
        </div>
    </div>

<script>
    // ID फॉर्मेटिंग
    function formatID(id) {
        if (!id) return "";
        let clean = id.toString().replace(/["']/g, '').trim();
        if (!clean.toUpperCase().startsWith("NPPNCN-")) {
            clean = "NPPNCN-" + clean;
        }
        return clean;
    }

    function parseCSVRow(row) {
        const result = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            let char = row[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) {
                result.push(cur.trim());
                cur = "";
            } else cur += char;
        }
        result.push(cur.trim());
        return result;
    }

    async function loadData() {
        const params = new URLSearchParams(window.location.search);
        let rawId = params.get('id');
        if(!rawId) return;

        const searchId = formatID(decodeURIComponent(rawId));

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/);

            for(let i = 1; i < rows.length; i++) {
                if(!rows[i].trim()) continue;
                const cols = parseCSVRow(rows[i]);
                const csvId = formatID(cols[0]);

                if(csvId === searchId) {
                    document.getElementById('edit_id').value = csvId;
                    document.getElementById('edit_ward').value = cols[1] || "";
                    document.getElementById('edit_name').value = cols[2] || "";
                    document.getElementById('edit_mobile').value = cols[5] || "";
                    document.getElementById('edit_curr').value = cols[6] || 0;
                    document.getElementById('edit_arr').value = cols[7] || 0;
                    calculate();
                    break;
                }
            }
        } catch(e) { console.error(e); }
    }

    function calculate() {
        let curr = parseFloat(document.getElementById('edit_curr').value) || 0;
        let arr = parseFloat(document.getElementById('edit_arr').value) || 0;
        document.getElementById('edit_total').value = curr + arr;
    }

    function handleSave() {
        // ID चेक करना कि NPPNCN- लगा है या नहीं
        let finalId = formatID(document.getElementById('edit_id').value);
        document.getElementById('edit_id').value = finalId;

        alert("डाटा सफलतापूर्वक अपडेट कर दिया गया है!");
        window.location.href = "connection_detail.html?id=" + encodeURIComponent(finalId);
    }

    window.onload = loadData;
</script>
</body>
</html>
