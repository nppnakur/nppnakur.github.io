<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Update Record - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; }

        body {
            background: #fdfaf4;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }

        .main-card {
            width: 100%;
            max-width: 850px;
            height: 96vh;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .header h1 { font-size: 20px; color: #ff8c00; font-weight: 700; }
        
        .back-btn {
            width: 35px; height: 35px;
            background: #eee;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            text-decoration: none;
        }

        .edit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; font-weight: 700; color: #ff8c00; text-transform: uppercase; }
        
        .input-group input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            font-size: 14px;
            font-weight: 600;
            color: #222;
            outline: none;
        }
        .input-group input:focus { border-color: #ff8c00; background: #fff; }

        .calc-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 12px;
            background: #fff8f0;
            border-radius: 12px;
            border: 1px dashed #ff8c00;
        }

        .money-card { background: white; padding: 10px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .money-card label { 
            font-size: 12px; 
            display: block; 
            margin-bottom: 3px; 
            color: #333; 
            font-weight: 800; /* Bold Label */
        }
        .money-card input { width: 100%; border: none; text-align: center; font-size: 16px; font-weight: 700; color: #ff8c00; background: transparent; outline: none; }

        .total-box { background: #ff8c00; border: none; }
        .total-box label { color: white; font-weight: 800; }
        .total-box input { color: white !important; }

        .action-btns {
            display: flex;
            justify-content: center;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-save {
            background: #ff8c00;
            color: #fff;
            padding: 12px 50px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-save:hover { transform: scale(1.02); }

        @media (max-width: 600px) {
            .edit-grid { grid-template-columns: 1fr; }
            .calc-section { grid-template-columns: repeat(3, 1fr); }
            .money-card input { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <h1><i class="fas fa-edit"></i> रिकॉर्ड अपडेट करें</h1>
            <a href="connection_detail.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        </header>

        <div class="edit-grid">
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>कनेक्शन आईडी (Prefix: NPPNCN-)</label>
                <input type="text" id="edit_id">
            </div>
            
            <div class="input-group">
                <label>उपभोक्ता का नाम</label>
                <input type="text" id="edit_name">
            </div>
            
            <div class="input-group">
                <label>वार्ड नं. / नाम</label>
                <input type="text" id="edit_ward">
            </div>
            
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>मोबाइल नंबर</label>
                <input type="text" id="edit_mobile">
            </div>

            <div class="calc-section">
                <div class="money-card">
                    <label>मांग (₹)</label>
                    <input type="number" id="edit_curr" oninput="calculate()">
                </div>
                <div class="money-card">
                    <label>बकाया (₹)</label>
                    <input type="number" id="edit_arr" oninput="calculate()">
                </div>
                <div class="money-card total-box">
                    <label>कुल देय (₹)</label>
                    <input type="number" id="edit_total" readonly>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-save" onclick="handleSave()">
                <i class="fas fa-sync-alt"></i> UPDATE RECORD
            </button>
        </div>
    </div>

<script>
    // CSV और URL से आईडी साफ़ करने का फंक्शन
    function getCleanID(id) {
        if (!id) return "";
        let str = decodeURIComponent(id).replace(/["']/g, '').trim();
        // अगर आईडी में केवल नंबर है, तो NPPNCN- जोड़ें
        if (!str.toUpperCase().startsWith("NPPNCN-")) {
            str = "NPPNCN-" + str;
        }
        return str;
    }

    async function loadData() {
        const params = new URLSearchParams(window.location.search);
        let rawId = params.get('id');
        if(!rawId) return;

        const targetId = getCleanID(rawId);

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/);

            for(let i = 1; i < rows.length; i++) {
                if(!rows[i].trim()) continue;
                
                // CSV Parsing (Handling Quotes)
                const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const currentId = getCleanID(cols[0]);

                if(currentId === targetId) {
                    document.getElementById('edit_id').value = currentId;
                    document.getElementById('edit_ward').value = (cols[1] || "").replace(/"/g, '');
                    document.getElementById('edit_name').value = (cols[2] || "").replace(/"/g, '');
                    document.getElementById('edit_mobile').value = (cols[5] || "").replace(/"/g, '');
                    
                    // पैसे को नंबर में बदलकर भरना
                    let m_curr = parseFloat((cols[6] || "0").replace(/[₹,]/g, '')) || 0;
                    let m_arr = parseFloat((cols[7] || "0").replace(/[₹,]/g, '')) || 0;
                    
                    document.getElementById('edit_curr').value = m_curr;
                    document.getElementById('edit_arr').value = m_arr;
                    
                    calculate();
                    break;
                }
            }
        } catch(e) { console.error("Data Load Error:", e); }
    }

    function calculate() {
        let curr = parseFloat(document.getElementById('edit_curr').value) || 0;
        let arr = parseFloat(document.getElementById('edit_arr').value) || 0;
        document.getElementById('edit_total').value = curr + arr;
    }

    function handleSave() {
        // फाइनल आईडी सुनिश्चित करें
        let idVal = document.getElementById('edit_id').value;
        if(idVal && !idVal.toUpperCase().startsWith("NPPNCN-")) {
            idVal = "NPPNCN-" + idVal;
        }
        
        alert("डाटा सफलतापूर्वक अपडेट हो गया!");
        // वापस डिटेल्स पेज पर भेजें
        window.location.href = "connection_detail.html?id=" + encodeURIComponent(idVal);
    }

    window.onload = loadData;
</script>
</body>
</html>
