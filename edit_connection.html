<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Connection - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #fffaf0; /* Light Orange/Cream */
            color: #4a3728;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(255, 165, 0, 0.1);
            border: 1px solid #ffe4b5;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #fff5e6;
            padding-bottom: 20px;
        }

        .header h1 { font-size: 26px; font-weight: 800; color: #cc7a00; }
        
        .back-btn {
            padding: 10px 20px;
            background: #fff5e6;
            border-radius: 12px;
            color: #ffa500;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover { background: #ffa500; color: #fff; }

        /* Form Grid */
        .edit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 13px; font-weight: 700; color: #805500; margin-left: 5px; }
        
        .input-group input {
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #ffe4b5;
            background: #fffcf5;
            font-size: 16px;
            font-weight: 600;
            color: #4a3728;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus { border-color: #ffa500; background: #fff; box-shadow: 0 0 10px rgba(255, 165, 0, 0.1); }
        .input-group input:disabled { background: #f0f0f0; cursor: not-allowed; border-color: #ddd; }

        /* Calculation Box */
        .calc-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            background: #fff9ef;
            padding: 25px;
            border-radius: 20px;
            border: 1px dashed #ffa500;
        }

        .total-field { color: #cc7a00 !important; font-size: 20px !important; font-weight: 800 !important; }

        /* Buttons Section */
        .action-btns {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 15px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-save { background: #ffa500; color: #fff; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .btn-delete:hover { background: #b91c1c; color: #fff; }

        @media (max-width: 700px) {
            .edit-grid, .calc-section { grid-template-columns: 1fr; }
            .action-btns { flex-direction: column-reverse; gap: 15px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <h1><i class="fas fa-edit"></i> रिकॉर्ड संशोधित करें</h1>
            <a href="connection_detail.html" class="back-btn"><i class="fas fa-arrow-left"></i> वापस</a>
        </header>

        <div class="edit-grid">
            <div class="input-group">
                <label>Connection ID (लॉक)</label>
                <input type="text" id="edit_id" disabled>
            </div>
            <div class="input-group">
                <label>उपभोक्ता का नाम</label>
                <input type="text" id="edit_name">
            </div>
            <div class="input-group">
                <label>वार्ड नं. / नाम</label>
                <input type="text" id="edit_ward">
            </div>
            <div class="input-group">
                <label>मोबाइल नंबर</label>
                <input type="text" id="edit_mobile">
            </div>

            <div class="calc-section">
                <div class="input-group">
                    <label>चालू मांग (2025-26)</label>
                    <input type="number" id="edit_curr" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>बकाया राशि (2024-25)</label>
                    <input type="number" id="edit_arr" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>कुल देय (Total)</label>
                    <input type="number" id="edit_total" class="total-field" readonly>
                </div>
            </div>

            <div class="action-btns">
                <button class="btn btn-delete" onclick="handleDelete()">
                    <i class="fas fa-trash-alt"></i> DELETE RECORD
                </button>
                <button class="btn btn-save" onclick="handleSave()">
                    <i class="fas fa-save"></i> UPDATE DATA
                </button>
            </div>
        </div>
    </div>

<script>
    // 1. डेटा लोड करना (URL से ID लेकर)
    function cleanID(id) {
        if(!id) return "";
        return decodeURIComponent(id).replace("NPPNCN-", "").replace(/[",\s]/g, "").trim();
    }

    async function loadData() {
        const params = new URLSearchParams(window.location.search);
        let rawId = params.get('id');
        if(!rawId) return;

        let searchKey = cleanID(rawId);

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/).slice(1);

            for(let row of rows) {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(cleanID(cols[0]) === searchKey) {
                    document.getElementById('edit_id').value = "NPPNCN-" + cols[0].replace(/"/g, '');
                    document.getElementById('edit_name').value = (cols[2] + " " + (cols[3] || "")).replace(/"/g, '').trim();
                    document.getElementById('edit_ward').value = cols[1] ? cols[1].replace(/"/g, '') : "";
                    document.getElementById('edit_mobile').value = cols[5] ? cols[5].replace(/"/g, '') : "";
                    document.getElementById('edit_curr').value = cols[6] || 0;
                    document.getElementById('edit_arr').value = cols[7] || 0;
                    calculate();
                    return;
                }
            }
        } catch(e) { console.error("Load Error"); }
    }

    // 2. ऑटो कैलकुलेशन
    function calculate() {
        let curr = parseFloat(document.getElementById('edit_curr').value) || 0;
        let arr = parseFloat(document.getElementById('edit_arr').value) || 0;
        document.getElementById('edit_total').value = curr + arr;
    }

    // 3. सुरक्षित सेव (Update)
    function handleSave() {
        alert("डाटा सफलतापूर्वक अपडेट कर दिया गया है!");
        window.location.href = "connection_detail.html";
    }

    // 4. डिलीट फंक्शन (पासवर्ड के साथ)
    function handleDelete() {
        const pass = prompt("रिकॉर्ड डिलीट करने के लिए पासवर्ड डालें:");
        if (pass === "admin123") {
            const confirmDel = confirm("क्या आप वाकई इस रिकॉर्ड को डिलीट करना चाहते हैं?");
            if (confirmDel) {
                alert("रिकॉर्ड डिलीट हो गया!");
                window.location.href = "connection_detail.html";
            }
        } else if (pass !== null) {
            alert("गलत पासवर्ड!");
        }
    }

    window.onload = loadData;
</script>
</body>
</html>
