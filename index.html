<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>NAGAR PALIKA NAKUR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; 
      width: 100%; height: 100%;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background-color: #000;
    }

    body {
      background-image: url('https://ptaxsnn.com/Login/images/banner.jpg');
      background-size: cover; background-position: center;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }

    h2 {
      position: absolute; top: 3%; width: 100%; text-align: center;
      font-size: clamp(18px, 5vw, 28px); color: #fff; 
      margin: 0; z-index: 10;
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.7);
      text-transform: uppercase;
    }

    /* Container की हाइट कम और चौड़ाई ज्यादा की गई */
    .container {
      background-color: rgba(0, 0, 0, 0.45); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 25px 40px;
      display: flex; 
      flex-direction: row;
      width: 95%; 
      max-width: 950px; 
      min-height: auto; /* हाइट कंटेंट के हिसाब से कम रहेगी */
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      z-index: 5;
      align-items: center;
    }

    .logo-section { flex: 0.8; display: flex; align-items: center; justify-content: center; }

    /* बीच का दंडा (Divider) */
    .divider {
      width: 2px;
      height: 220px;
      background: linear-gradient(to bottom, transparent, #ffcc00, transparent);
      margin: 0 35px;
    }

    .rotating-logo {
      width: clamp(120px, 20vw, 220px);
      filter: drop-shadow(0 0 10px rgba(255,204,0,0.4));
      animation: smoothSwing 5s ease-in-out infinite;
    }

    @keyframes smoothSwing {
      0%, 100% { transform: rotateY(-15deg); }
      50% { transform: rotateY(15deg); }
    }

    .form-section { flex: 1.2; }
    .form-section h3 { color: #ffcc00; text-align: center; margin: 0 0 20px 0; font-size: 24px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { color: #ffcc00; font-size: 11px; font-weight: 600; display: block; margin-bottom: 4px; margin-left: 10px; }

    .form-group input {
      width: 100%; padding: 10px 18px; border-radius: 50px;
      border: 1px solid rgba(255, 204, 0, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: #fff; outline: none; font-size: 14px;
    }

    /* Captcha CSS */
    .captcha-row {
      display: flex; align-items: center; gap: 8px; margin-top: 5px;
    }
    #captcha-code {
      background: #ffcc00; color: #000; padding: 6px 12px; 
      font-weight: bold; border-radius: 5px; letter-spacing: 3px;
      font-style: italic; user-select: none; font-size: 16px;
    }
    .refresh-icon { color: #ffcc00; cursor: pointer; font-size: 18px; }

    .form-group button {
      width: 100%; padding: 12px; border-radius: 50px;
      border: none; background: linear-gradient(45deg, #ffcc00, #ffeb3b);
      color: #000; font-weight: 800; cursor: pointer; font-size: 15px;
      box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
      margin-top: 5px;
    }

    footer {
      position: absolute; bottom: 2%; width: 100%; text-align: center;
      color: rgba(255, 204, 0, 0.7); font-size: 11px; font-weight: bold;
    }

    /* Mobile Responsive Settings */
    @media (max-width: 768px) {
      .container { 
        flex-direction: column; 
        width: 90%; 
        padding: 20px; 
        margin-top: 40px;
      }
      .divider { display: none; } /* मोबाइल पर दंडा हटा दिया */
      .logo-section { margin-bottom: 15px; }
      .rotating-logo { width: 100px; }
      h2 { top: 2%; font-size: 18px; }
      .form-section h3 { font-size: 20px; margin-bottom: 15px; }
    }

    #otp-section { display: none; }
  </style>
</head>
<body>

<h2>WELCOME TO NAGAR PALIKA NAKUR</h2>

<div class="container">
  <div class="logo-section">
    <img src="img1.png" alt="Logo" class="rotating-logo">
  </div>

  <div class="divider"></div>

  <div class="form-section">
    <div id="login-section">
      <h3>ADMIN LOGIN</h3>
      <div class="form-group">
        <label>USER NAME</label>
        <input type="text" id="username" placeholder="Enter ID">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="Enter Password">
      </div>
      
      <div class="form-group">
        <label>SECURITY CAPTCHA</label>
        <div class="captcha-row">
          <div id="captcha-code"></div>
          <span class="refresh-icon" onclick="generateCaptcha()">🔄</span>
          <input type="text" id="captcha-input" placeholder="Code" style="width: 100px; padding: 8px 12px;">
        </div>
      </div>

      <div class="form-group">
        <button type="button" id="loginBtn">SEND OTP</button>
      </div>
    </div>
    
    <div id="otp-section">
      <h3>VERIFY OTP</h3>
      <p style="color:#4caf50; text-align:center; font-size:13px; font-weight:bold; margin-bottom:15px;">✅ OTP SENT TO REGISTERED EMAIL</p>
      <div class="form-group">
        <label>6-DIGIT OTP</label>
        <input type="text" id="user-otp" placeholder="XXXXXX" maxlength="6">
      </div>
      <div class="form-group">
        <button type="button" id="verifyBtn">VERIFY & LOGIN</button>
      </div>
    </div>
  </div>
</div>

<footer>
  &copy; COPYRIGHT BY SUNNY DHAKA
</footer>

<script>
emailjs.init("u_DDKYPoptkEmoftY");

const SERVICE_ID = "service_25eenak";
const TEMPLATE_ID = "template_hdj6nfo";
let generatedOTP = null;
let currentCaptcha = "";

function generateCaptcha() {
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    currentCaptcha = "";
    for (let i = 0; i < 5; i++) {
        currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById("captcha-code").innerText = currentCaptcha;
}

window.onload = generateCaptcha;

document.getElementById('loginBtn').onclick = function() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const captchaInp = document.getElementById('captcha-input').value.trim();

    if (user === "Sunnydhaka" && pass === "Sunny1990") {
        if (captchaInp.toUpperCase() !== currentCaptcha) {
            alert("Invalid Captcha!");
            generateCaptcha();
            return;
        }

        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        this.innerText = "SENDING...";
        this.disabled = true;

        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
            to_email: "sunnydhaka91@gmail.com",
            otp: generatedOTP,
            user_name: user
        }).then(function() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('otp-section').style.display = 'block';
        }, function(err) {
            alert("Error: " + err.text);
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerText = "SEND OTP";
        });
    } else {
        alert("Incorrect Username or Password!");
    }
};

document.getElementById('verifyBtn').onclick = function() {
    const entered = document.getElementById('user-otp').value.trim();
    if (parseInt(entered) === generatedOTP) {
        this.innerText = "VERIFYING...";
        this.disabled = true;
        localStorage.setItem("isLoggedIn", "true");
        setTimeout(() => {
            window.location.href = "dashboard.html"; 
        }, 800);
    } else {
        alert("Invalid OTP! Please check again.");
    }
};
</script>
</body>
</html>
