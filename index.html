<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>NAGAR PALIKA NAKUR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; 
      width: 100%; height: 100%;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background-color: #000;
    }

    body {
      background-image: url('https://ptaxsnn.com/Login/images/banner.jpg');
      background-size: cover; background-position: center;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }

    h2 {
      position: absolute; top: 3%; width: 100%; text-align: center;
      font-size: clamp(18px, 5vw, 28px); color: #fff; 
      margin: 0; z-index: 10;
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.7);
      text-transform: uppercase;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.5); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      display: flex; 
      flex-direction: row;
      width: 90%; 
      max-width: 850px; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      z-index: 5;
      align-items: center;
    }

    .logo-section { flex: 0.7; display: flex; align-items: center; justify-content: center; }

    .divider {
      width: 2px;
      height: 250px;
      background: linear-gradient(to bottom, transparent, #ffcc00, transparent);
      margin: 0 30px;
    }

    .rotating-logo {
      width: clamp(100px, 15vw, 180px);
      filter: drop-shadow(0 0 15px rgba(255,204,0,0.5));
      animation: smoothSwing 5s ease-in-out infinite;
    }

    @keyframes smoothSwing {
      0%, 100% { transform: rotateY(-15deg); }
      50% { transform: rotateY(15deg); }
    }

    .form-section { flex: 1.3; }
    .form-section h3 { color: #ffcc00; text-align: center; margin: 0 0 25px 0; font-size: 22px; letter-spacing: 1px; }

    /* लेबल और इनपुट को एक सीध में लाने के लिए Flex */
    .form-group { 
      display: flex; 
      align-items: center; 
      margin-bottom: 15px; 
      gap: 15px;
    }

    .form-group label { 
      color: #ffcc00; 
      font-size: 11px; 
      font-weight: 700; 
      width: 100px; /* लेबल की फिक्स्ड विड्थ ताकि सब सीध में रहें */
      text-align: right;
    }

    .form-group input {
      flex: 1;
      max-width: 250px;
      padding: 8px 18px; 
      border-radius: 50px;
      border: 1px solid rgba(255, 204, 0, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: #fff; outline: none; font-size: 13px;
    }

    /* Captcha Row को सेट करने के लिए */
    .captcha-row {
      display: flex; 
      align-items: center; 
      gap: 10px;
      flex: 1;
    }
    
    #captcha-code {
      background: #ffcc00; color: #000; padding: 5px 10px; 
      font-weight: bold; border-radius: 4px; letter-spacing: 2px;
      font-style: italic; user-select: none; font-size: 14px;
    }
    
    .refresh-icon { color: #ffcc00; cursor: pointer; font-size: 18px; }

    .btn-container {
      margin-top: 20px;
      padding-left: 115px; /* लेबल की चौड़ाई के हिसाब से खिसकाया */
    }

    button {
      width: 100%; 
      max-width: 250px;
      padding: 10px; 
      border-radius: 50px;
      border: none; 
      background: linear-gradient(45deg, #ffcc00, #ffeb3b);
      color: #000; font-weight: 800; cursor: pointer; font-size: 14px;
      box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
      transition: transform 0.2s;
    }

    button:active { transform: scale(0.98); }

    footer {
      position: absolute; bottom: 2%; width: 100%; text-align: center;
      color: rgba(255, 204, 0, 0.6); font-size: 10px; font-weight: bold;
    }

    @media (max-width: 768px) {
      .container { flex-direction: column; width: 92%; padding: 20px; }
      .divider { display: none; }
      .form-group { flex-direction: column; align-items: flex-start; gap: 5px; }
      .form-group label { text-align: left; width: 100%; margin-left: 15px; }
      .form-group input, button { max-width: 100%; width: 100%; }
      .btn-container { padding-left: 0; width: 100%; }
    }

    #otp-section { display: none; }
  </style>
</head>
<body>

<h2>WELCOME TO NAGAR PALIKA NAKUR</h2>

<div class="container">
  <div class="logo-section">
    <img src="img1.png" alt="Logo" class="rotating-logo">
  </div>

  <div class="divider"></div>

  <div class="form-section">
    <div id="login-section">
      <h3>ADMIN LOGIN</h3>
      
      <div class="form-group">
        <label>USER NAME</label>
        <input type="text" id="username" placeholder="Enter ID">
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="Enter Password">
      </div>
      
      <div class="form-group">
        <label>CAPTCHA</label>
        <div class="captcha-row">
          <div id="captcha-code"></div>
          <span class="refresh-icon" onclick="generateCaptcha()">🔄</span>
          <input type="text" id="captcha-input" placeholder="Code" style="max-width: 100px; padding: 7px 12px;">
        </div>
      </div>

      <div class="btn-container">
        <button type="button" id="loginBtn">SEND OTP</button>
      </div>
    </div>
    
    <div id="otp-section">
      <h3>VERIFY OTP</h3>
      <p style="color:#4caf50; text-align:center; font-size:12px; font-weight:bold; margin-bottom:15px;">✅ OTP SENT TO EMAIL</p>
      <div class="form-group">
        <label>ENTER OTP</label>
        <input type="text" id="user-otp" placeholder="XXXXXX" maxlength="6">
      </div>
      <div class="btn-container">
        <button type="button" id="verifyBtn">VERIFY & LOGIN</button>
      </div>
    </div>
  </div>
</div>

<footer>
  &copy; COPYRIGHT BY SUNNY DHAKA
</footer>

<script>
emailjs.init("u_DDKYPoptkEmoftY");
const SERVICE_ID = "service_25eenak";
const TEMPLATE_ID = "template_hdj6nfo";
let generatedOTP = null;
let currentCaptcha = "";

function generateCaptcha() {
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    currentCaptcha = "";
    for (let i = 0; i < 5; i++) {
        currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById("captcha-code").innerText = currentCaptcha;
}

window.onload = generateCaptcha;

document.getElementById('loginBtn').onclick = function() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const captchaInp = document.getElementById('captcha-input').value.trim();

    if (user === "Sunnydhaka" && pass === "Sunny1990") {
        if (captchaInp.toUpperCase() !== currentCaptcha) {
            alert("Invalid Captcha!");
            generateCaptcha();
            return;
        }
        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        this.innerText = "SENDING...";
        this.disabled = true;
        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
            to_email: "sunnydhaka91@gmail.com",
            otp: generatedOTP,
            user_name: user
        }).then(function() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('otp-section').style.display = 'block';
        }, function(err) {
            alert("Error: " + err.text);
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerText = "SEND OTP";
        });
    } else {
        alert("Incorrect Username or Password!");
    }
};

document.getElementById('verifyBtn').onclick = function() {
    const entered = document.getElementById('user-otp').value.trim();
    if (parseInt(entered) === generatedOTP) {
        this.innerText = "VERIFYING...";
        this.disabled = true;
        localStorage.setItem("isLoggedIn", "true");
        setTimeout(() => {
            window.location.href = "dashboard.html"; 
        }, 800);
    } else {
        alert("Invalid OTP! Please check again.");
    }
};
</script>
</body>
</html>
