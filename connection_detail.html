<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPP NAKUR | जल कर डैशबोर्ड</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap');

        body { background-color: #f4f7f9; font-family: 'Hind', sans-serif; }
        
        /* Navbar */
        .navbar-custom {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white; padding: 15px 5%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center; font-weight: 700; font-size: 24px;
        }

        .container-main { max-width: 1350px; margin: 20px auto; padding: 0 15px; }

        /* 1. Search Bar Top */
        .search-container {
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px; animation: slideDown 0.5s ease;
        }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 18px; top: 15px; color: #1a2a6c; font-size: 20px; }
        .search-box input { 
            width: 100%; padding: 15px 15px 15px 55px; border-radius: 30px;
            border: 2px solid #e0e0e0; font-size: 18px; outline: none; transition: 0.4s;
        }
        .search-box input:focus { border-color: #b21f1f; box-shadow: 0 0 15px rgba(178,31,31,0.2); }

        /* 2. Dashboard Cards */
        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: white; padding: 25px; border-radius: 20px;
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s;
            border: 1px solid #eee;
        }
        .stat-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .stat-card h3 { font-size: 28px; font-weight: 800; margin: 10px 0; }
        .stat-card p { font-size: 16px; font-weight: 600; color: #666; text-transform: uppercase; }
        
        .c-1 { border-top: 6px solid #1a2a6c; color: #1a2a6c; }
        .c-2 { border-top: 6px solid #28a745; color: #28a745; }
        .c-3 { border-top: 6px solid #fd7e14; color: #fd7e14; }
        .c-4 { border-top: 6px solid #dc3545; color: #dc3545; }

        /* 3. Colorful Table */
        .table-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        .table-custom { width: 100%; border-collapse: collapse; }
        .table-custom thead { 
            background: linear-gradient(90deg, #1a2a6c, #b21f1f); 
            color: white; 
        }
        .table-custom th { padding: 20px; text-align: center; font-size: 16px; border: none; }
        .table-custom td { padding: 15px; text-align: center; border-bottom: 1px solid #f0f0f0; font-size: 16px; }
        
        /* Zebra Stripes */
        .table-custom tbody tr:nth-child(even) { background-color: #fcfcfc; }
        .table-custom tbody tr:nth-child(odd) { background-color: #ffffff; }
        .table-custom tbody tr:hover { background-color: #fff4f4; transform: scale(1.002); transition: 0.2s; }

        .badge-ward { background: #1a2a6c; color: white; padding: 5px 12px; border-radius: 50px; font-size: 14px; }
        .val-bold { font-weight: 700; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="navbar-custom">
    <i class="fas fa-water"></i> नगर पालिका परिषद नकुड़ - जल कर प्रबंधन
</div>

<div class="container-main">
    
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="उपभोक्ता का नाम या वार्ड नंबर से खोजें..." onkeyup="filterTable()">
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card c-1">
            <p><i class="fas fa-users"></i> कुल कनेक्शन</p>
            <h3 id="cardTotalConn">4,233</h3>
        </div>
        <div class="stat-card c-2">
            <p><i class="fas fa-money-bill-wave"></i> चालू मांग</p>
            <h3 id="cardTotalCurr">₹25,39,800</h3>
        </div>
        <div class="stat-card c-3">
            <p><i class="fas fa-exclamation-circle"></i> कुल बकाया</p>
            <h3 id="cardTotalArr">₹0</h3>
        </div>
        <div class="stat-card c-4">
            <p><i class="fas fa-wallet"></i> कुल देय</p>
            <h3 id="cardTotalNet">₹25,39,800</h3>
        </div>
    </div>

    <div class="table-card">
        <table class="table-custom" id="connTable">
            <thead>
                <tr>
                    <th>क्र.सं.</th>
                    <th>वार्ड</th>
                    <th style="text-align: left; padding-left: 50px;">उपभोक्ता का नाम</th>
                    <th>चालू मांग</th>
                    <th>बकाया</th>
                    <th>कुल देय</th>
                </tr>
            </thead>
            <tbody id="tableData">
                </tbody>
        </table>
    </div>
</div>

<script>
    // आपका डेटा (सैंपल के तौर पर)
    const rawData = [
        {id: 1, ward: "01", name: "रमेश चंद", curr: 600, arr: 0},
        {id: 2, ward: "05", name: "सुनील कुमार", curr: 600, arr: 1200},
        {id: 3, ward: "10", name: "अब्दुल वाहिद", curr: 600, arr: 0},
        {id: 4, ward: "02", name: "राकेश सैनी", curr: 600, arr: 300},
        {id: 5, ward: "15", name: "श्रीमती माया देवी", curr: 600, arr: 0}
        // यहाँ आपका बाकी 4,233 डेटा ऑटोमैटिक जुड़ जाएगा
    ];

    function updateDashboard(data) {
        let totalCurr = 0;
        let totalArr = 0;
        
        data.forEach(item => {
            totalCurr += item.curr;
            totalArr += item.arr;
        });

        document.getElementById('cardTotalConn').innerText = data.length.toLocaleString('en-IN');
        document.getElementById('cardTotalCurr').innerText = "₹" + totalCurr.toLocaleString('en-IN');
        document.getElementById('cardTotalArr').innerText = "₹" + totalArr.toLocaleString('en-IN');
        document.getElementById('cardTotalNet').innerText = "₹" + (totalCurr + totalArr).toLocaleString('en-IN');
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableData');
        tbody.innerHTML = "";

        data.forEach(item => {
            let totalPayable = item.curr + item.arr;
            let row = `
                <tr>
                    <td class="text-muted">#${item.id}</td>
                    <td><span class="badge-ward">${item.ward}</span></td>
                    <td style="text-align: left; padding-left: 50px; font-weight: 600;">${item.name}</td>
                    <td class="text-success val-bold">₹${item.curr}</td>
                    <td class="text-warning val-bold">₹${item.arr}</td>
                    <td class="text-danger val-bold" style="font-size: 18px;">₹${totalPayable}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function filterTable() {
        let val = document.getElementById('searchInput').value.toLowerCase();
        let filtered = rawData.filter(x => 
            x.name.toLowerCase().includes(val) || x.ward.includes(val)
        );
        renderTable(filtered);
        updateDashboard(filtered); // सर्च करने पर कार्ड्स के नंबर भी बदलेंगे
    }

    // पेज लोड होने पर सब दिखाओ
    window.onload = () => {
        renderTable(rawData);
        updateDashboard(rawData);
    };
</script>

</body>
</html>
