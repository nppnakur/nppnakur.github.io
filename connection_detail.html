<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नया कनेक्शन - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { --primary: #10b981; --gradient: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0fdf4; padding: 20px; }
        
        .form-card {
            max-width: 550px; margin: 20px auto; background: white; 
            padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 8px solid #10b981;
        }
        
        .logo-box { text-align: center; margin-bottom: 15px; }
        h2 { color: #065f46; text-align: center; margin-bottom: 25px; font-weight: 800; }
        
        .group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; color: #374151; font-size: 14px; }
        input, select {
            width: 100%; padding: 12px 15px; border: 2px solid #e5e7eb; border-radius: 10px; 
            outline: none; transition: 0.3s; font-size: 15px;
        }
        input:focus, select:focus { border-color: var(--primary); background: #f9fafb; }
        
        /* 600 RS Locked */
        input[readonly] { background: #f3f4f6; color: #059669; font-weight: 800; cursor: not-allowed; }

        .btn-submit {
            width: 100%; background: var(--gradient); color: white; border: none;
            padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700;
            cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); opacity: 0.95; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #6b7280; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #10b981; }
    </style>
</head>
<body>

<div class="form-card">
    <div class="logo-box">
        <img src="img1.png" height="70" alt="Logo">
    </div>
    <h2>नया जल कनेक्शन</h2>
    
    <form id="addForm">
        <div class="group">
            <label><i class="fas fa-hashtag"></i> कनेक्शन नंबर*</label>
            <input type="text" id="id" required placeholder="जैसे: JL12345">
        </div>
        
        <div class="group">
            <label><i class="fas fa-map-marker-alt"></i> वार्ड चुनें (ऑटो)*</label>
            <select id="ward" required>
                <option value="">वार्ड लोड हो रहे हैं...</option>
            </select>
        </div>

        <div class="group">
            <label><i class="fas fa-user"></i> उपभोक्ता का नाम*</label>
            <input type="text" id="name" required placeholder="पूरा नाम दर्ज करें">
        </div>

        <div class="group">
            <label><i class="fas fa-phone"></i> मोबाइल नंबर</label>
            <input type="tel" id="mobile" maxlength="10" placeholder="10 अंकों का नंबर">
        </div>

        <div class="group">
            <label><i class="fas fa-money-bill-wave"></i> चालू मांग (Fixed)</label>
            <input type="number" id="curr" value="600" readonly>
        </div>

        <div class="group">
            <label><i class="fas fa-hand-holding-usd"></i> बकाया राशि (Arrear)</label>
            <input type="number" id="arr" value="0" step="0.01">
        </div>

        <button type="submit" class="btn-submit">
            <i class="fas fa-save"></i> डेटा सुरक्षित करें
        </button>
    </form>
    
    <a href="connection_detail.html" class="back-link"><i class="fas fa-arrow-left"></i> वापस लिस्ट पर जाएँ</a>
</div>

<script>
    // 1. CSV फाइल से वार्ड्स की लिस्ट बनाना
    async function loadWards() {
        try {
            const response = await fetch('Connection_data.csv');
            const csvText = await response.text();
            const lines = csvText.split('\n').slice(1);
            let wardSet = new Set();

            lines.forEach(line => {
                const parts = line.split(',');
                if(parts[1]) {
                    let wName = parts[1].trim().replace(/"/g, '');
                    if(wName) wardSet.add(wName);
                }
            });

            const select = document.getElementById('ward');
            select.innerHTML = '<option value="" disabled selected>-- वार्ड चुनें --</option>';
            
            // वार्डों को सॉर्ट करके डालना (01, 02...)
            Array.from(wardSet).sort().forEach(ward => {
                select.innerHTML += `<option value="${ward}">${ward}</option>`;
            });

        } catch (error) {
            console.error("Ward load error:", error);
            document.getElementById('ward').innerHTML = '<option value="">वार्ड लोड नहीं हुए</option>';
        }
    }

    // 2. फॉर्म सबमिट करने का लॉजिक
    document.getElementById('addForm').onsubmit = function(event) {
        event.preventDefault();
        
        const currentCharge = parseFloat(document.getElementById('curr').value);
        const arrearCharge = parseFloat(document.getElementById('arr').value) || 0;

        const connectionData = {
            id: document.getElementById('id').value,
            ward: document.getElementById('ward').value,
            name: document.getElementById('name').value,
            mobile: document.getElementById('mobile').value || '-',
            curr: currentCharge,
            arr: arrearCharge,
            total: currentCharge + arrearCharge,
            isNew: true
        };

        // LocalStorage में डेटा सेव करना
        let existingEntries = JSON.parse(localStorage.getItem('water_connections') || '[]');
        existingEntries.push(connectionData);
        localStorage.setItem('water_connections', JSON.stringify(existingEntries));

        // सक्सेस मैसेज
        alert("बधाई हो! नया कनेक्शन '" + connectionData.name + "' सफलतापूर्वक जोड़ दिया गया है।");
        
        // लिस्ट वाले पेज पर वापस भेजें
        window.location.href = 'connection_detail.html';
    };

    window.onload = loadWards;
</script>

</body>
</html>
