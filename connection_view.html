<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background: #fffaf0; 
            color: #4a3728;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 850px;
            background: #fff;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(255, 165, 0, 0.12);
            border: 1px solid #ffe4b5;
        }

        /* Top Bar with Combined Buttons */
        .top-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .nav-link {
            width: 45px; height: 45px; 
            background: #fff5e6; 
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #ffa500; text-decoration: none; 
            transition: 0.3s; font-size: 18px;
            border: 1px solid #ffe4b5;
        }
        .nav-link:hover { background: #ffa500; color: #fff; transform: scale(1.05); }

        /* Header Section */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #fff9ef;
        }
        .profile-header img { width: 65px; height: 65px; border-radius: 15px; border: 2px solid #ffa500; }
        .profile-header h1 { font-size: 22px; color: #cc7a00; font-weight: 800; }

        /* Detail Grid */
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .data-box { display: flex; flex-direction: column; gap: 6px; }
        .data-box label { font-size: 11px; font-weight: 700; color: #a07d5a; text-transform: uppercase; margin-left: 5px; }
        .data-box input {
            padding: 14px; border-radius: 12px; border: 1px solid #ffe4b5;
            background: #fffdfa; font-size: 15px; font-weight: 600; color: #4a3728; outline: none;
        }

        /* Money Row */
        .money-strip {
            grid-column: 1 / -1;
            display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 12px;
            margin-top: 10px; background: #fff9ef; padding: 20px; border-radius: 18px;
            border: 1px solid #ffedcc;
        }
        .money-strip input { width: 100%; border: none; background: transparent; font-size: 20px; font-weight: 800; color: #cc7a00; }
        .total-highlight { background: #ffa500; border-radius: 12px; padding: 10px; }
        .total-highlight label { color: #fff; }
        .total-highlight input { color: #fff !important; font-size: 24px !important; }

        /* Toolbar Icons */
        .toolbar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end; /* Align all to right */
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #fff5e6;
        }

        .icon-btn {
            width: 55px; height: 55px;
            border-radius: 15px;
            border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-print { background: #f0f0f0; color: #555; }
        .btn-pay { background: #e8f5e9; color: #2e7d32; }
        .btn-edit { background: #fff3e0; color: #ef6c00; }
        .btn-delete { background: #ffebee; color: #c62828; }

        .icon-btn:hover { transform: translateY(-5px); filter: brightness(0.9); }

        @media (max-width: 600px) {
            .details-grid, .money-strip { grid-template-columns: 1fr; }
            .toolbar { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <a href="https://nppnakur.github.io/connection_detail.html" class="nav-link" title="सूची पर वापस">
                <i class="fas fa-arrow-left"></i>
            </a>
            <a href="https://nppnakur.github.io/water_manegment.html" class="nav-link" title="होम">
                <i class="fas fa-home"></i>
            </a>
        </div>

        <header class="profile-header">
            <img src="img1.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1067/1067566.png'">
            <div>
                <h1>उपभोक्ता विवरण</h1>
                <p>न.पा.प. नकुड़ - जल कल विभाग</p>
            </div>
        </header>

        <div class="details-grid">
            <div class="data-box" style="grid-column: 1 / -1;">
                <label>Connection ID & Name</label>
                <input type="text" id="full_id_display" disabled>
            </div>
            
            <div class="data-box">
                <label>उपभोक्ता का नाम</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="data-box">
                <label>वार्ड</label>
                <input type="text" id="disp_ward" disabled>
            </div>

            <div class="money-strip">
                <div class="data-box">
                    <label>चालू मांग</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="data-box">
                    <label>बकाया</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="data-box total-highlight">
                    <label>कुल देय राशि</label>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="toolbar">
                <button class="icon-btn btn-print" title="Print" onclick="window.print()">
                    <i class="fas fa-print"></i>
                </button>
                
                <button class="icon-btn btn-pay" title="Pay Bill" onclick="location.href='https://nppnakur.github.io/pay_bill.html'">
                    <i class="fas fa-file-invoice-dollar"></i>
                </button>

                <button class="icon-btn btn-edit" title="Edit" onclick="goToEdit()">
                    <i class="fas fa-user-edit"></i>
                </button>

                <button class="icon-btn btn-delete" title="Delete" onclick="handleDelete()">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    // URL से पूरी ID निकालने का उन्नत तरीका
    function getFullData() {
        const urlString = window.location.href;
        const url = new URL(urlString);
        // 'id' पैरामीटर को डिकोड करना ताकि हिंदी अक्षर न कटें
        const fullId = decodeURIComponent(url.searchParams.get("id") || "");

        if(fullId) {
            document.getElementById('full_id_display').value = fullId;
            
            // ID से नाम और राशि अलग करने की कोशिश (अगर पैटर्न फिक्स है)
            // उदाहरण के लिए, मान लेते हैं कि "₹" से पहले नाम है
            const namePart = fullId.split('0₹')[0] || "Name Not Found";
            document.getElementById('disp_name').value = namePart;
            
            // डमी डाटा सेट करना (यहाँ आप CSV फेच लॉजिक भी डाल सकते हैं)
            document.getElementById('disp_ward').value = "नगर क्षेत्र";
            document.getElementById('disp_curr').value = "₹ 600";
            document.getElementById('disp_arr').value = "₹ 600";
            document.getElementById('disp_total').value = "₹ 1200";
        }
    }

    function goToEdit() {
        const pass = prompt("एडमिन पासवर्ड:");
        if (pass === "admin123") {
            const currentId = encodeURIComponent(document.getElementById('full_id_display').value);
            window.location.href = "edit_connection.html?id=" + currentId;
        } else if(pass !== null) alert("गलत पासवर्ड!");
    }

    function handleDelete() {
        const pass = prompt("डिलीट करने के लिए पासवर्ड:");
        if (pass === "admin123") {
            if(confirm("सावधान! क्या आप यह रिकॉर्ड मिटाना चाहते हैं?")) {
                alert("सफलतापूर्वक हटाया गया!");
                window.location.href = "https://nppnakur.github.io/connection_detail.html";
            }
        }
    }

    window.onload = getFullData;
</script>
</body>
</html>
