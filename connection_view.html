<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-width: 260px;
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --glass-white: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #f0f4f8;
            display: flex;
            min-height: 100vh;
        }

        /* Side Navigation */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary-gradient);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            color: white;
            position: fixed;
            height: 100vh;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            text-align: center;
        }

        .logo-area img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            padding: 5px;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-links { list-style: none; margin-top: 20px; }
        .nav-links li { margin-bottom: 15px; }
        .nav-links a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* Main Content Area */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-top h2 { color: var(--text-main); font-size: 28px; }

        .detail-card {
            background: var(--glass-white);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            border: 1px solid white;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group label {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field-group input {
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            font-size: 16px;
            font-weight: 600;
            color: #334155;
            transition: 0.3s;
        }

        .field-group input:focus { border-color: #3b82f6; outline: none; background: white; }

        /* Amount Highlights */
        .financial-grid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: 20px;
            margin-top: 15px;
        }

        .money-box {
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid transparent;
        }

        .money-box.current { background: #eff6ff; border-color: #bfdbfe; }
        .money-box.arrears { background: #fff7ed; border-color: #fed7aa; }
        .money-box.total { background: #fef2f2; border-color: #fecaca; }

        .money-box span { font-size: 11px; color: #64748b; display: block; margin-bottom: 5px; font-weight: 700; }
        .money-box input { 
            text-align: center; border: none !important; background: transparent !important; 
            font-size: 22px !important; font-weight: 800 !important; color: #1e293b !important;
        }
        .money-box.total input { color: #b91c1c !important; }

        /* Action Buttons Area */
        .bottom-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-edit { background: #1e293b; color: white; }
        .btn-print { background: white; border: 2px solid #e2e8f0; color: #64748b; }
        .btn-save { background: #10b981; color: white; display: none; }

        @media (max-width: 1000px) {
            .sidebar { width: 80px; padding: 20px 10px; }
            .sidebar span, .sidebar h4 { display: none; }
            .main-wrapper { margin-left: 80px; }
            .detail-card { grid-template-columns: 1fr; }
            .financial-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area">
            <img src="img1.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1067/1067566.png'">
            <h4>NPP NAKUR</h4>
            <p style="font-size: 10px; opacity: 0.7;">Digital Services</p>
        </div>
        <ul class="nav-links">
            <li><a href="connection_detail.html" class="active"><i class="fas fa-home"></i> <span>Dashboard</span></a></li>
            <li><a href="#" onclick="window.print()"><i class="fas fa-print"></i> <span>Print Receipt</span></a></li>
            <li><a href="#"><i class="fas fa-history"></i> <span>History</span></a></li>
            <li><a href="connection_detail.html" style="margin-top: 50px;"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <div class="header-top">
            <div>
                <h2>उपभोक्ता विवरण</h2>
                <p style="color: #64748b;">NPP Water Connection Management</p>
            </div>
            <div style="background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <i class="fas fa-calendar-alt" style="color: #3b82f6;"></i> 
                <span id="currentDate" style="margin-left: 10px; font-weight: 600; font-size: 14px;"></span>
            </div>
        </div>

        <div class="detail-card">
            <div class="field-group">
                <label>Connection ID</label>
                <input type="text" id="disp_id" disabled>
            </div>
            <div class="field-group">
                <label>Consumer Name</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="field-group">
                <label>Ward Detail</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            <div class="field-group">
                <label>Mobile Number</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="financial-grid">
                <div class="money-box current">
                    <span>चालू मांग (2025-2026)</span>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="money-box arrears">
                    <span>बकाया राशि (2024-2025)</span>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="money-box total">
                    <span>कुल देय (Total)</span>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="bottom-actions">
                <button id="saveBtn" class="btn btn-save" onclick="saveRecord()"><i class="fas fa-check"></i> Save Changes</button>
                <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                <button class="btn btn-edit" id="editBtn" onclick="enableEdit()"><i class="fas fa-user-edit"></i> Edit Details</button>
            </div>
        </div>
    </div>

<script>
    // ID Cleaner (Fix for Baljeet Singh ID 1,191)
    function cleanID(id) {
        if(!id) return "";
        return decodeURIComponent(id).replace("NPPNCN-", "").replace(/[",\s]/g, "").trim();
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        let rawId = params.get('id');
        if(!rawId) return;

        let target = cleanID(rawId);
        document.getElementById('currentDate').innerText = new Date().toDateString();

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/).slice(1);

            for(let row of rows) {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(!cols[0]) continue;

                if(cleanID(cols[0]) === target) {
                    document.getElementById('disp_id').value = "NPPNCN-" + cols[0].replace(/"/g, '');
                    document.getElementById('disp_name').value = (cols[2] + " " + (cols[3] || "")).replace(/"/g, '').trim();
                    document.getElementById('disp_ward').value = cols[1] ? cols[1].replace(/"/g, '') : "N/A";
                    document.getElementById('disp_mobile').value = cols[5] ? cols[5].replace(/"/g, '') : "N/A";
                    document.getElementById('disp_curr').value = "₹" + (cols[6] || "0");
                    document.getElementById('disp_arr').value = "₹" + (cols[7] || "0");
                    document.getElementById('disp_total').value = "₹" + (cols[8] || "0");
                    return;
                }
            }
        } catch(e) { console.error("Error loading CSV"); }
    }

    function enableEdit() {
        if(prompt("Enter Admin Password:") === "admin123") {
            document.querySelectorAll('input').forEach(i => { if(i.id !== 'disp_id') i.disabled = false; });
            document.getElementById('saveBtn').style.display = 'flex';
            document.getElementById('editBtn').style.display = 'none';
        }
    }

    function saveRecord() { alert("Update Saved!"); location.reload(); }

    window.onload = init;
</script>
</body>
</html>
