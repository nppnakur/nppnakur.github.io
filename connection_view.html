<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #fffaf0; /* Creamy Orange Background */
            color: #4a3728;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-card {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(255, 165, 0, 0.1);
            border: 1px solid #ffe4b5;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left img { width: 70px; height: 70px; border-radius: 20px; border: 2px solid #ffa500; }
        .header-left h1 { font-size: 26px; font-weight: 800; color: #cc7a00; }
        .header-left p { font-size: 14px; color: #996633; }

        .home-btn {
            width: 45px; height: 45px; background: #fff5e6; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #ffa500; text-decoration: none; transition: 0.3s;
        }
        .home-btn:hover { background: #ffa500; color: #fff; }

        /* Grid System */
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .input-item { display: flex; flex-direction: column; gap: 8px; }
        .input-item label { font-size: 12px; font-weight: 700; color: #805500; text-transform: uppercase; }
        .input-item input {
            padding: 15px; border-radius: 15px; border: 1px solid #ffe4b5;
            background: #fffcf5; font-size: 16px; font-weight: 600; color: #4a3728;
        }

        /* Money Cards */
        .money-section {
            grid-column: 1 / -1;
            display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px;
            margin-top: 15px; background: #fff9ef; padding: 20px; border-radius: 20px;
        }
        .money-card label { font-size: 11px; color: #996633; font-weight: 800; }
        .money-card input { 
            width: 100%; border: none; background: transparent; 
            font-size: 22px; font-weight: 800; color: #cc7a00; outline: none;
        }
        .money-card.total-bg { background: #ffa500; padding: 15px; border-radius: 15px; }
        .money-card.total-bg label { color: #fff; opacity: 0.9; }
        .money-card.total-bg input { color: #fff; font-size: 26px; }

        /* Buttons Toolbar */
        .footer-toolbar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #fff5e6;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 12px 20px; border-radius: 12px; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }

        /* Colors */
        .btn-pay { background: #28a745; color: #fff; } /* Green for Pay */
        .btn-print { background: #6c757d; color: #fff; }
        .btn-edit { background: #ffa500; color: #fff; }
        .btn-delete { background: #fff; color: #dc3545; border: 1px solid #ffcccc; }
        .btn-save { background: #007bff; color: #fff; display: none; }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-delete:hover { background: #dc3545; color: #fff; }

        @media (max-width: 768px) {
            .details-grid, .money-section { grid-template-columns: 1fr; }
            .footer-toolbar { flex-direction: column-reverse; gap: 20px; }
            .btn-group { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <div class="header-left">
                <img src="img1.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1067/1067566.png'">
                <div>
                    <h1>Consumer Details</h1>
                    <p>नगर पालिका परिषद नकुड़ (सहारनपुर)</p>
                </div>
            </div>
            <a href="index.html" class="home-btn"><i class="fas fa-home"></i></a>
        </header>

        <div class="details-grid">
            <div class="input-item">
                <label>Connection ID</label>
                <input type="text" id="disp_id" disabled>
            </div>
            <div class="input-item">
                <label>Consumer Name</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="input-item">
                <label>Ward No / Name</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            <div class="input-item">
                <label>Mobile No.</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="money-section">
                <div class="money-card">
                    <label>चालू मांग (2025-26)</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="money-card">
                    <label>पुराना बकाया</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="money-card total-bg">
                    <label>कुल देय राशि</label>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="footer-toolbar">
                <button class="btn btn-delete" onclick="handleDelete()">
                    <i class="fas fa-trash-alt"></i> DELETE
                </button>

                <div class="btn-group">
                    <button class="btn btn-print" onclick="window.print()">
                        <i class="fas fa-print"></i> PRINT
                    </button>
                    
                    <button class="btn btn-pay" onclick="handlePay()">
                        <i class="fas fa-file-invoice-dollar"></i> PAY BILL
                    </button>

                    <button class="btn btn-edit" id="editBtn" onclick="enableEdit()">
                        <i class="fas fa-edit"></i> EDIT
                    </button>

                    <button id="saveBtn" class="btn btn-save" onclick="saveData()">
                        <i class="fas fa-check-circle"></i> SAVE CHANGES
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
    // URL से डेटा प्राप्त करने और पेज भरने का फंक्शन
    function getParams() {
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('disp_id').value = urlParams.get('id') || "NPPNCN-000";
        // डमी डेटा (यहाँ आप अपनी CSV/DB लॉजिक लगा सकते हैं)
        document.getElementById('disp_name').value = "उपभोक्ता का नाम"; 
        document.getElementById('disp_ward').value = "Ward-10";
        document.getElementById('disp_mobile').value = "98XXXXXXXX";
        document.getElementById('disp_curr').value = "₹ 500.00";
        document.getElementById('disp_arr').value = "₹ 1200.00";
        document.getElementById('disp_total').value = "₹ 1700.00";
    }

    // Edit बटन का फंक्शन
    function enableEdit() {
        const pass = prompt("एडमिन पासवर्ड दर्ज करें:");
        if (pass === "admin123") {
            document.querySelectorAll('input').forEach(input => {
                if(input.id !== 'disp_id' && input.id !== 'disp_total') input.disabled = false;
            });
            document.getElementById('saveBtn').style.display = 'flex';
            document.getElementById('editBtn').style.display = 'none';
        } else {
            alert("गलत पासवर्ड!");
        }
    }

    // Save बटन
    function saveData() {
        alert("डेटा सफलतापूर्वक अपडेट किया गया!");
        location.reload();
    }

    // Pay बटन (बिल भुगतान के लिए)
    function handlePay() {
        const id = document.getElementById('disp_id').value;
        alert("भुगतान खिड़की खुल रही है: " + id);
        // यहाँ आप pay_bill.html पर भेज सकते हैं
    }

    // Delete बटन (सुरक्षा के साथ)
    function handleDelete() {
        const pass = prompt("हटाने के लिए पासवर्ड डालें:");
        if (pass === "admin123") {
            if(confirm("सावधान! क्या आप वाकई इस रिकॉर्ड को मिटाना चाहते हैं?")) {
                alert("रिकॉर्ड हटा दिया गया!");
                window.location.href = "connection_detail.html";
            }
        } else if(pass !== null) {
            alert("गलत पासवर्ड!");
        }
    }

    window.onload = getParams;
</script>
</body>
</html>
