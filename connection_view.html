<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #fffaf0; 
            color: #4a3728;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(255, 165, 0, 0.1);
            border: 1px solid #ffe4b5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #fff5e6;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-left img { width: 70px; height: 70px; border-radius: 10px; }
        .header-left h1 { font-size: 24px; font-weight: 800; color: #cc7a00; }

        .header-right { display: flex; gap: 12px; }
        .nav-btn {
            width: 45px; height: 45px; background: #fff5e6; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #ffa500; text-decoration: none; transition: 0.3s; font-size: 18px;
            border: 1px solid #ffe4b5;
        }
        .nav-btn:hover { background: #ffa500; color: #fff; transform: translateY(-3px); }

        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .input-item { display: flex; flex-direction: column; gap: 8px; }
        .input-item label { font-size: 12px; font-weight: 700; color: #805500; text-transform: uppercase; }
        .input-item input {
            padding: 16px; border-radius: 15px; border: 1px solid #ffe4b5;
            background: #fffcf5; font-size: 16px; font-weight: 600; color: #4a3728; outline: none;
        }

        .money-section {
            grid-column: 1 / -1;
            display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px;
            margin-top: 15px; background: #fff9ef; padding: 25px; border-radius: 20px;
            border: 1px dashed #ffa500;
        }
        .money-card input { width: 100%; border: none; background: transparent; font-size: 22px; font-weight: 800; color: #cc7a00; }
        
        .total-box { background: #ffa500; padding: 15px; border-radius: 15px; }
        .total-box label { color: #fff; }
        .total-box input { color: #fff !important; font-size: 26px !important; }

        .toolbar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #fff5e6;
        }

        .icon-circle {
            width: 55px; height: 55px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .btn-print { background: #6c757d; color: #fff; }
        .btn-pay { background: #28a745; color: #fff; }
        .btn-edit { background: #ffa500; color: #fff; }
        .btn-delete { background: #fff; color: #dc3545; border: 1px solid #ffcccc; }

        .icon-circle:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

        @media (max-width: 650px) {
            .details-grid, .money-section { grid-template-columns: 1fr; }
            .header { flex-direction: column-reverse; text-align: center; gap: 15px; }
            .header-left { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <div class="header-left">
                <img src="img1.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1067/1067566.png'">
                <div>
                    <h1>उपभोक्ता विवरण</h1>
                    <p>न.पा.प. नकुड़ - जल विभाग</p>
                </div>
            </div>
            
            <div class="header-right">
                <a href="https://nppnakur.github.io/connection_detail.html" class="nav-btn" title="वापस सूची पर">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <a href="https://nppnakur.github.io/water_manegment.html" class="nav-btn" title="होम पेज">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </header>

        <div class="details-grid">
            <div class="input-item" style="grid-column: 1 / -1;">
                <label>Connection ID</label>
                <input type="text" id="disp_id" disabled placeholder="NPPNCN-XXXX">
            </div>
            <div class="input-item">
                <label>उपभोक्ता का नाम</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="input-item">
                <label>वार्ड नं. / नाम</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            <div class="input-item" style="grid-column: 1 / -1;">
                <label>मोबाइल नंबर</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="money-section">
                <div class="money-card">
                    <label>चालू मांग 2025-2026</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="money-card">
                    <label>बकाया 2024-2025</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="money-card total-box">
                    <label>कुल देय</label>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="toolbar">
                <button class="icon-circle btn-print" title="Print" onclick="window.print()">
                    <i class="fas fa-print"></i>
                </button>
                <button class="icon-circle btn-pay" title="Pay Bill" onclick="location.href='https://nppnakur.github.io/pay_bill.html'">
                    <i class="fas fa-file-invoice-dollar"></i>
                </button>
                <button class="icon-circle btn-edit" title="Edit" onclick="goToEdit()">
                    <i class="fas fa-pencil-alt"></i>
                </button>
                <button class="icon-circle btn-delete" title="Delete" onclick="handleDelete()">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    function cleanID(id) {
        if (!id) return "";
        return id.replace(/[,"']/g, '').trim();
    }

    // आईडी को छोटा करने वाला फंक्शन (NPPNCN-161218 -> NPPNCN-1612)
    function formatShortID(fullId) {
        if (!fullId) return "";
        // अगर आईडी में डैश है, तो पहले दो हिस्से लें (NPPNCN और संख्या का शुरुआती भाग)
        let parts = fullId.split('-');
        if (parts.length >= 2) {
            let numPart = parts[1].substring(0, 4); // संख्या के पहले 4 अंक
            return parts[0] + "-" + numPart;
        }
        return fullId;
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get('id'); 
        if(!rawId) return;

        const originalId = decodeURIComponent(rawId);
        
        // डिस्प्ले में छोटी आईडी दिखाएं
        document.getElementById('disp_id').value = formatShortID(originalId);
        
        const searchIdClean = cleanID(originalId);

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/);

            for(let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if(!row) continue;

                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if(cols[0]) {
                    const csvIdClean = cleanID(cols[0]);
                    
                    if(searchIdClean.includes(csvIdClean) || csvIdClean.includes(searchIdClean)) {
                        document.getElementById('disp_name').value = (cols[2] + " " + (cols[3] || "")).replace(/"/g, '').trim();
                        document.getElementById('disp_ward').value = cols[1] ? cols[1].replace(/"/g, '') : "N/A";
                        document.getElementById('disp_mobile').value = cols[5] ? cols[5].replace(/"/g, '') : "---";
                        document.getElementById('disp_curr').value = "₹ " + (cols[6] || "0");
                        document.getElementById('disp_arr').value = "₹ " + (cols[7] || "0");
                        document.getElementById('disp_total').value = "₹ " + (cols[8] || "0");
                        return;
                    }
                }
            }
        } catch(e) { console.log("Fetch Error", e); }
    }

    function goToEdit() {
        const pass = prompt("पासवर्ड डालें:");
        if (pass === "admin123") {
            // एडिट पर जाते समय ओरिजिनल आईडी भेजें ताकि डेटा मिल सके
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            window.location.href = "edit_connection.html?id=" + id;
        }
    }

    function handleDelete() {
        const pass = prompt("डिलीट पासवर्ड:");
        if (pass === "admin123") {
            if(confirm("रिकॉर्ड डिलीट करें?")) {
                window.location.href = "https://nppnakur.github.io/connection_detail.html";
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
