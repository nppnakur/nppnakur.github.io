<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NPP NAKUR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.1);
            --neon-blue: #00d2ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --dark-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body { 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Landscape Container */
        .dashboard {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 300px; /* Left: Info, Right: Actions */
            gap: 20px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Header Section */
        .header-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            margin-bottom: 10px;
        }

        .header-panel h2 { 
            font-size: 24px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Information Grid */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .card label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .card input {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            outline: none;
        }

        .card input:disabled { color: white; cursor: default; }
        .card.editing { border: 1px solid var(--neon-green); background: rgba(57, 255, 20, 0.05); }

        /* Amount Section */
        .amount-box {
            grid-column: 1 / -1;
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .total-card {
            flex: 1;
            background: linear-gradient(45deg, rgba(255, 49, 49, 0.1), rgba(0, 0, 0, 0));
            border-left: 5px solid var(--neon-red);
        }

        /* Right Side Actions */
        .action-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 15px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            transition: all 0.3s;
            color: white;
            text-transform: uppercase;
        }

        .btn-pay { background: rgba(57, 255, 20, 0.2); border: 1px solid var(--neon-green); color: var(--neon-green); }
        .btn-edit { background: rgba(0, 210, 255, 0.2); border: 1px solid var(--neon-blue); color: var(--neon-blue); }
        .btn-print { background: rgba(255, 255, 255, 0.1); border: 1px solid white; }
        .btn-delete { background: rgba(255, 49, 49, 0.2); border: 1px solid var(--neon-red); color: var(--neon-red); }

        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px currentColor; }
        
        .save-btn { display: none; background: var(--neon-green); color: black; margin-top: 10px; }

        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
        }

        /* Mobile View (Portrait fallback) */
        @media (max-width: 850px) {
            .dashboard { grid-template-columns: 1fr; }
            .info-panel { grid-template-columns: 1fr; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

<div style="display: flex; flex-direction: column; width: 100%; align-items: center;">
    <div class="dashboard">
        <div class="header-panel">
            <div>
                <p style="font-size: 12px; color: #94a3b8;">NPP NAKUR - WATER DEPT.</p>
                <h2>Consumer Dashboard</h2>
            </div>
            <div id="statusBadge" style="background: var(--neon-blue); color: black; padding: 5px 15px; border-radius: 20px; font-weight: 900; font-size: 12px;">OFFICIAL RECORD</div>
        </div>

        <div class="info-panel">
            <div class="card">
                <label>Connection ID</label>
                <input type="text" id="disp_id" disabled>
            </div>
            <div class="card">
                <label>Consumer Name</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="card">
                <label>Ward Detail</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            <div class="card">
                <label>Mobile Number</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="amount-box">
                <div class="card" style="flex:1">
                    <label>Current Demand</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="card" style="flex:1">
                    <label>Arrears</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="card total-card" style="flex:1">
                    <label style="color: var(--neon-red);">Net Payable Amount</label>
                    <input type="text" id="disp_total" style="color: var(--neon-red); font-size: 24px;" disabled>
                </div>
            </div>
            
            <button id="saveBtn" class="btn save-btn" onclick="saveChanges()">
                <i class="fas fa-check"></i> Save New Details
            </button>
        </div>

        <div class="action-panel">
            <button class="btn btn-pay" onclick="alert('Payment Gateway Loading...')">
                <i class="fas fa-credit-card"></i> Pay Bill
            </button>
            <button class="btn btn-edit" id="editBtn" onclick="enableEdit()">
                <i class="fas fa-user-edit"></i> Edit Info
            </button>
            <button class="btn btn-print" onclick="window.print()">
                <i class="fas fa-print"></i> Print Receipt
            </button>
            <button class="btn btn-delete" onclick="handleDelete()">
                <i class="fas fa-trash-alt"></i> Delete Entry
            </button>
        </div>
    </div>

    <a href="connection_detail.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Connection List
    </a>
</div>

<script>
    let currentId = "";
    let isLocal = false;

    async function loadData() {
        const params = new URLSearchParams(window.location.search);
        currentId = params.get('id');
        
        if(!currentId) return;

        // Try LocalStorage first
        const localList = JSON.parse(localStorage.getItem('newConnections') || '[]');
        let data = localList.find(i => i.id == currentId || `NPPNCN-${i.id}` == currentId);

        if(data) {
            isLocal = true;
            fillForm(data);
            document.getElementById('statusBadge').innerText = "NEW ENTRY";
        } else {
            // Try CSV
            try {
                const res = await fetch('Connection_data.csv');
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                
                for(let row of rows) {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(!cols[0]) continue;
                    
                    let cleanCsvId = cols[0].replace(/"/g, '').replace(/,/g, '').trim();
                    let cleanSearchId = currentId.replace("NPPNCN-", "").replace(/"/g, '').replace(/,/g, '').trim();

                    if(cleanCsvId === cleanSearchId) {
                        fillForm({
                            id: `NPPNCN-${cols[0].replace(/"/g, '')}`,
                            name: cols[2].replace(/"/g, ''),
                            ward: cols[1],
                            mobile: cols[5],
                            curr: cols[6],
                            arr: cols[7],
                            total: cols[8]
                        });
                        break;
                    }
                }
            } catch(e) {}
        }
    }

    function fillForm(d) {
        document.getElementById('disp_id').value = d.id;
        document.getElementById('disp_name').value = d.name;
        document.getElementById('disp_ward').value = d.ward;
        document.getElementById('disp_mobile').value = d.mobile;
        document.getElementById('disp_curr').value = "₹" + d.curr;
        document.getElementById('disp_arr').value = "₹" + d.arr;
        document.getElementById('disp_total').value = "₹" + d.total;
    }

    function enableEdit() {
        const pass = prompt("Enter Admin Password to Edit:");
        if(pass === "admin123") {
            document.querySelectorAll('.card input').forEach(input => {
                if(input.id !== 'disp_id') { // ID should not change
                    input.disabled = false;
                    input.parentElement.classList.add('editing');
                }
            });
            document.getElementById('saveBtn').style.display = 'flex';
            document.getElementById('editBtn').style.display = 'none';
        } else {
            alert("Wrong Password!");
        }
    }

    function saveChanges() {
        alert("Changes Saved Locally! (Note: CSV data cannot be permanently changed in browser)");
        location.reload();
    }

    function handleDelete() {
        const pass = prompt("Enter Admin Password to DELETE:");
        if(pass === "admin123") {
            if(confirm("Are you sure? This cannot be undone.")) {
                if(isLocal) {
                    let list = JSON.parse(localStorage.getItem('newConnections') || '[]');
                    const filtered = list.filter(i => i.id != currentId && `NPPNCN-${i.id}` != currentId);
                    localStorage.setItem('newConnections', JSON.stringify(filtered));
                    window.location.href = "connection_detail.html";
                } else {
                    alert("Cannot delete CSV data from client side.");
                }
            }
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
