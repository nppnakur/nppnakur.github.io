<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f1f5f9; /* हल्का ग्रे बैकग्राउंड ताकि सफेद कार्ड अलग दिखे */
            --card-white: #ffffff;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

        body { 
            background-color: var(--bg-color); 
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 280px; 
            gap: 25px;
            background: var(--card-white);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }

        .header-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .logo-section { display: flex; align-items: center; gap: 15px; }
        .logo-section img { width: 60px; height: 60px; object-fit: contain; }
        .logo-section h2 { color: var(--primary); font-size: 24px; font-weight: 800; }

        .info-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        /* डेटा बॉक्स डिजाइन */
        .data-box {
            background: #f8fafc; /* बॉक्स के अंदर हल्का रंग */
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .data-box label { 
            display: block; 
            font-size: 11px; 
            color: #64748b; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 4px; 
        }

        .data-box input { 
            background: transparent; 
            border: none; 
            color: #1e293b; 
            font-size: 16px; 
            font-weight: 700; 
            width: 100%; 
            outline: none; 
        }

        .data-box.editing { 
            background: #fff; 
            border-color: var(--accent); 
            box-shadow: 0 0 8px rgba(59,130,246,0.2); 
        }

        /* रकम वाला हिस्सा */
        .amount-row { 
            grid-column: 1 / -1; 
            display: grid; 
            grid-template-columns: 1fr 1fr 1.5fr; 
            gap: 15px; 
            margin-top: 10px; 
        }

        .total-highlight { 
            background: #fff1f2; 
            border: 1px solid #fecaca; 
        }
        .total-highlight label { color: #be123b; }
        .total-highlight input { color: #be123b; font-size: 22px; font-weight: 900; }

        /* बटन पैनल */
        .action-panel { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            padding: 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; transition: 0.2s;
        }

        .btn-pay { background: var(--primary); color: white; }
        .btn-edit { background: white; color: var(--primary); border: 2px solid var(--primary); }
        .btn-print { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        #saveBtn { display: none; background: var(--success); color: white; width: 100%; margin-top: 10px; }

        .back-btn { margin-top: 25px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: 600; }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .amount-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <div class="dashboard">
        <div class="header-panel">
            <div class="logo-section">
                <img src="img1.png" alt="NPP" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                <div>
                    <h2>उपभोक्ता विवरण</h2>
                    <p style="color: #94a3b8; font-size: 12px;">नगर पालिका परिषद नकुड़ (सहारनपुर)</p>
                </div>
            </div>
            <span style="border: 1px solid #10b981; color: #10b981; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800;">LIVE DATABASE</span>
        </div>

        <div class="info-panel">
            <div class="data-box"><label>ID (पहचान संख्या)</label><input type="text" id="disp_id" disabled></div>
            <div class="data-box"><label>नाम (Consumer Name)</label><input type="text" id="disp_name" disabled></div>
            <div class="data-box"><label>वार्ड (Ward)</label><input type="text" id="disp_ward" disabled></div>
            <div class="data-box"><label>मोबाइल (Mobile)</label><input type="text" id="disp_mobile" disabled></div>

            <div class="amount-row">
                <div class="data-box"><label>चालू मांग</label><input type="text" id="disp_curr" disabled></div>
                <div class="data-box"><label>बकाया</label><input type="text" id="disp_arr" disabled></div>
                <div class="data-box total-highlight"><label>कुल देय राशि</label><input type="text" id="disp_total" disabled></div>
            </div>
            <button id="saveBtn" class="btn" onclick="saveData()"><i class="fas fa-check-circle"></i> डेटा सुरक्षित करें</button>
        </div>

        <div class="action-panel">
            <button class="btn btn-pay" onclick="alert('Payment Option Coming Soon...')"><i class="fas fa-money-bill-wave"></i> PAY BILL</button>
            <button class="btn btn-edit" id="editBtn" onclick="enableEdit()"><i class="fas fa-user-edit"></i> EDIT INFO</button>
            <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> PRINT</button>
            <button class="btn btn-delete" onclick="handleDelete()"><i class="fas fa-trash"></i> DELETE</button>
        </div>
    </div>

    <a href="connection_detail.html" class="back-btn"><i class="fas fa-arrow-left"></i> वापस सूची पर जाएं</a>
</div>

<script>
    // सबसे मुख्य फंक्शन: आईडी को क्लीन करना
    function cleanID(id) {
        if(!id) return "";
        return id.toString().replace("NPPNCN-", "").replace(/[",\s]/g, "").trim();
    }

    async function loadData() {
        const params = new URLSearchParams(window.location.search);
        let rawSearchId = params.get('id');
        if(!rawSearchId) return;

        let targetId = cleanID(rawSearchId);

        // 1. LocalStorage Check
        const local = JSON.parse(localStorage.getItem('newConnections') || '[]');
        let found = local.find(i => cleanID(i.id) === targetId);

        if(found) {
            render(found);
        } else {
            // 2. CSV Check
            try {
                const res = await fetch('Connection_data.csv');
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1);

                for(let row of rows) {
                    // CSV कोमा हैंडलर
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(!cols[0]) continue;

                    if(cleanID(cols[0]) === targetId) {
                        render({
                            id: `NPPNCN-${cols[0].replace(/"/g, '')}`,
                            ward: cols[1] || "N/A",
                            name: (cols[2] + " " + (cols[3] || "") + " " + (cols[4] || "")).replace(/"/g, '').replace(/\s+/g, ' ').trim(),
                            mobile: cols[5] || "N/A",
                            curr: cols[6] || "0",
                            arr: cols[7] || "0",
                            total: cols[8] || "0"
                        });
                        return;
                    }
                }
                alert("डाटा नहीं मिला: " + rawSearchId);
            } catch(e) { console.error("CSV Load Error"); }
        }
    }

    function render(d) {
        document.getElementById('disp_id').value = d.id;
        document.getElementById('disp_name').value = d.name;
        document.getElementById('disp_ward').value = d.ward;
        document.getElementById('disp_mobile').value = d.mobile;
        document.getElementById('disp_curr').value = "₹" + d.curr.toString().replace("₹","");
        document.getElementById('disp_arr').value = "₹" + d.arr.toString().replace("₹","");
        document.getElementById('disp_total').value = "₹" + d.total.toString().replace("₹","");
    }

    function enableEdit() {
        if(prompt("संशोधन के लिए पासवर्ड डालें:") === "admin123") {
            document.querySelectorAll('.data-box input').forEach(input => {
                if(input.id !== 'disp_id') {
                    input.disabled = false;
                    input.parentElement.classList.add('editing');
                }
            });
            document.getElementById('saveBtn').style.display = 'flex';
            document.getElementById('editBtn').style.display = 'none';
        }
    }

    function saveData() {
        alert("डेटा अपडेट हो गया!");
        location.reload();
    }

    function handleDelete() {
        if(prompt("डिलीट के लिए पासवर्ड:") === "admin123") {
            if(confirm("क्या आप वाकई इसे हटाना चाहते हैं?")) {
                let local = JSON.parse(localStorage.getItem('newConnections') || '[]');
                let target = cleanID(document.getElementById('disp_id').value);
                let filtered = local.filter(i => cleanID(i.id) !== target);
                localStorage.setItem('newConnections', JSON.stringify(filtered));
                window.location.href = "connection_detail.html";
            }
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
