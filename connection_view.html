<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #fffaf0; /* Light Orange/Cream background */
            color: #4a3728;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-card {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(255, 165, 0, 0.1);
            border: 1px solid #ffe4b5;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left img {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            border: 2px solid #ffa500;
        }

        .header-left h1 { font-size: 28px; font-weight: 800; color: #cc7a00; }
        .header-left p { font-size: 14px; color: #996633; font-weight: 500; }

        .home-btn {
            width: 50px;
            height: 50px;
            background: #fff5e6;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffa500;
            text-decoration: none;
            transition: 0.3s;
        }
        .home-btn:hover { background: #ffa500; color: #fff; transform: translateY(-3px); }

        /* Data Grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .input-item { display: flex; flex-direction: column; gap: 10px; }
        .input-item label { font-size: 13px; font-weight: 700; color: #805500; margin-left: 5px; }
        
        .input-item input {
            padding: 18px;
            border-radius: 20px;
            border: 1px solid #ffe4b5;
            background: #fffcf5;
            font-size: 16px;
            font-weight: 600;
            color: #4a3728;
            transition: 0.3s;
        }

        .input-item input:focus { border-color: #ffa500; outline: none; background: #fff; }

        /* Money Cards */
        .money-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 20px;
            margin-top: 20px;
        }

        .money-card {
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #ffe4b5;
            background: #fffcf5;
        }

        .money-card label { font-size: 11px; color: #996633; font-weight: 800; text-transform: uppercase; }
        .money-card input { 
            width: 100%; border: none !important; background: transparent !important; 
            font-size: 24px !important; font-weight: 800 !important; color: #cc7a00 !important;
        }

        .money-card.total { background: #ffa500; border: none; }
        .money-card.total label { color: rgba(255,255,255,0.8); }
        .money-card.total input { color: #fff !important; font-size: 30px !important; }

        /* Buttons Area */
        .footer-btns {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between; /* Space for Delete on left, others on right */
            gap: 15px;
            margin-top: 30px;
        }

        .right-group { display: flex; gap: 15px; }

        .btn {
            padding: 15px 25px;
            border-radius: 18px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-edit { background: #805500; color: #fff; }
        .btn-print { background: #ffe4b5; color: #805500; }
        .btn-save { background: #05cd99; color: #fff; display: none; }
        .btn-delete { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-delete:hover { background: #b91c1c; color: #fff; }

        @media (max-width: 800px) {
            .details-grid, .money-section { grid-template-columns: 1fr; }
            .footer-btns { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <div class="header-left">
                <img src="img1.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1067/1067566.png'">
                <div>
                    <h1>Consumer Detail</h1>
                    <p>न.पा.प. नकुड़ - जल विभाग</p>
                </div>
            </div>
            <a href="connection_detail.html" class="home-btn" title="Home"><i class="fas fa-home"></i></a>
        </header>

        <div class="details-grid">
            <div class="input-item">
                <label>Connection ID</label>
                <input type="text" id="disp_id" disabled>
            </div>
            <div class="input-item">
                <label>Consumer Name</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="input-item">
                <label>Ward Name / No.</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            <div class="input-item">
                <label>Mobile Number</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="money-section">
                <div class="money-card">
                    <label>चालू मांग (2025-2026)</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="money-card">
                    <label>बकाया (2024-2025)</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="money-card total">
                    <label>कुल देय राशि (Total)</label>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="footer-btns">
                <button class="btn btn-delete" onclick="deleteRecord()">
                    <i class="fas fa-trash-alt"></i> DELETE
                </button>

                <div class="right-group">
                    <button id="saveBtn" class="btn btn-save" onclick="saveData()">
                        <i class="fas fa-save"></i> UPDATE
                    </button>
                    <button class="btn btn-print" onclick="window.print()">
                        <i class="fas fa-print"></i> PRINT
                    </button>
                    <button class="btn btn-edit" id="editBtn" onclick="enableEdit()">
                        <i class="fas fa-user-edit"></i> EDIT INFO
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
    function cleanID(id) {
        if(!id) return "";
        return decodeURIComponent(id).replace("NPPNCN-", "").replace(/[",\s]/g, "").trim();
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        let rawId = params.get('id');
        if(!rawId) return;

        let searchKey = cleanID(rawId);

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/).slice(1);

            for(let row of rows) {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(!cols[0]) continue;

                if(cleanID(cols[0]) === searchKey) {
                    document.getElementById('disp_id').value = "NPPNCN-" + cols[0].replace(/"/g, '');
                    document.getElementById('disp_name').value = (cols[2] + " " + (cols[3] || "")).replace(/"/g, '').trim();
                    document.getElementById('disp_ward').value = cols[1] ? cols[1].replace(/"/g, '') : "---";
                    document.getElementById('disp_mobile').value = cols[5] ? cols[5].replace(/"/g, '') : "---";
                    document.getElementById('disp_curr').value = "₹" + (cols[6] || "0");
                    document.getElementById('disp_arr').value = "₹" + (cols[7] || "0");
                    document.getElementById('disp_total').value = "₹" + (cols[8] || "0");
                    return;
                }
            }
        } catch(e) { console.error("Loading error"); }
    }

    function enableEdit() {
        if(prompt("Enter Admin Password:") === "admin123") {
            document.querySelectorAll('input').forEach(i => { if(i.id !== 'disp_id') i.disabled = false; });
            document.getElementById('saveBtn').style.display = 'flex';
            document.getElementById('editBtn').style.display = 'none';
        } else {
            alert("Wrong Password!");
        }
    }

    function saveData() { 
        alert("Updated Successfully!"); 
        location.reload(); 
    }

    // Delete Function with Password and Confirm
    function deleteRecord() {
        const pass = prompt("Enter Admin Password to DELETE:");
        if (pass === "admin123") {
            const confirmDel = confirm("Warning: Are you sure you want to delete this record? This cannot be undone.");
            if (confirmDel) {
                alert("Record Deleted Successfully!");
                window.location.href = "connection_detail.html"; 
            }
        } else if (pass !== null) {
            alert("Incorrect Password!");
        }
    }

    window.onload = init;
</script>
</body>
</html>
