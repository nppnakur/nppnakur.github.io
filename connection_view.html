<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>उपभोक्ता विवरण - NPP नकुड़</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* (आपका पुराना CSS यहाँ रहेगा, इसमें कोई बदलाव की जरूरत नहीं है) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; }
        body { background: linear-gradient(135deg, #f8f4e8 0%, #fff8ee 100%); color: #333; min-height: 100vh; padding: 20px; position: relative; overflow-x: hidden; }
        .main-card { width: 100%; max-width: 1000px; background: linear-gradient(145deg, #ffffff 0%, #fffbf2 100%); border-radius: 25px; padding: 30px; box-shadow: 0 20px 60px rgba(255, 140, 0, 0.1); border: 1px solid rgba(255, 200, 100, 0.3); margin: 0 auto; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; padding-bottom: 25px; border-bottom: 2px solid rgba(255, 182, 77, 0.2); }
        .logo-container { display: flex; align-items: center; gap: 20px; }
        .logo-circle { width: 90px; height: 90px; background: linear-gradient(135deg, #ff8c00, #ffcc00); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .logo-circle img { width: 70px; height: 70px; border-radius: 50%; }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn { width: 50px; height: 50px; background: white; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #ff8c00; text-decoration: none; border: 1px solid rgba(255, 182, 77, 0.3); }
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .input-item { display: flex; flex-direction: column; gap: 10px; }
        .input-item label { font-size: 13px; font-weight: 600; color: #ff8c00; }
        .input-item input { padding: 18px 20px; border-radius: 15px; border: 2px solid rgba(255, 182, 77, 0.2); background: #fffcf5; font-size: 16px; font-weight: 600; }
        .money-section { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 30px; background: #fff9ef; border-radius: 20px; border: 2px dashed rgba(255, 140, 0, 0.3); }
        .money-card { background: white; padding: 20px; border-radius: 18px; box-shadow: 0 8px 25px rgba(255, 140, 0, 0.1); }
        .total-box { background: linear-gradient(135deg, #ff8c00, #ffcc00); color: white; }
        .total-box input { color: white !important; font-size: 24px; border: none; background: transparent; font-weight: bold; }
        .money-card input { width: 100%; border: none; background: transparent; font-size: 20px; font-weight: 700; color: #ff8c00; }
        .toolbar { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 20px; margin-top: 30px; border-top: 2px solid rgba(255, 182, 77, 0.2); padding-top: 20px; }
        .icon-circle { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; transition: 0.3s; }
        .btn-print { background: #6c757d; }
        .btn-pay { background: #28a745; }
        .btn-edit { background: #ff8c00; }
        .btn-delete { background: white; color: #dc3545; border: 2px solid #ffcccc; }
        @media (max-width: 768px) { .details-grid, .money-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <div class="logo-container">
                <div class="logo-circle">
                    <img src="img1.png" alt="Logo" onerror="this.src='https://img.icons8.com/color/96/000000/water.png'">
                </div>
                <div class="logo-text">
                    <h1>उपभोक्ता विवरण</h1>
                    <p>नगर पालिका परिषद नकुड़ - जल आपूर्ति विभाग</p>
                </div>
            </div>
            
            <div class="nav-buttons">
                <a href="connection_detail.html" class="nav-btn"><i class="fas fa-arrow-left"></i></a>
                <a href="water_manegment.html" class="nav-btn"><i class="fas fa-home"></i></a>
            </div>
        </header>

        <div class="details-grid">
            <div class="input-item" style="grid-column: 1 / -1;">
                <label><i class="fas fa-id-card"></i> कनेक्शन आईडी</label>
                <input type="text" id="disp_id" disabled>
            </div>
            
            <div class="input-item">
                <label><i class="fas fa-user"></i> उपभोक्ता का नाम</label>
                <input type="text" id="disp_name" disabled>
            </div>
            
            <div class="input-item">
                <label><i class="fas fa-map-marker-alt"></i> वार्ड नं. / नाम</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            
            <div class="input-item" style="grid-column: 1 / -1;">
                <label><i class="fas fa-phone"></i> मोबाइल नंबर</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="money-section">
                <div class="money-card">
                    <label>चालू मांग</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="money-card">
                    <label>बकाया राशि</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="money-card total-box">
                    <label>कुल देय राशि</label>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="toolbar">
                <button class="icon-circle btn-print" onclick="window.print()"><i class="fas fa-print"></i></button>
                <button class="icon-circle btn-pay" onclick="location.href='pay_bill.html'"><i class="fas fa-file-invoice-dollar"></i></button>
                <button class="icon-circle btn-edit" onclick="goToEdit()"><i class="fas fa-pencil-alt"></i></button>
                <button class="icon-circle btn-delete" onclick="handleDelete()"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>
    </div>

<script>
    // 1. Clean ID Function: कोट्स और कॉमा हटाकर शुद्ध आईडी देता है
    function cleanID(id) {
        if (!id) return "";
        return id.toString().replace(/["',]/g, '').replace(/\s+/g, '').trim();
    }

    // 2. CSV Parser: जटिल कोट्स वाले डेटा को सही से अलग करता है
    function parseCSVRow(row) {
        const result = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            let char = row[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(cur.trim());
                cur = "";
            } else {
                cur += char;
            }
        }
        result.push(cur.trim());
        return result;
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        let rawId = params.get('id'); 
        
        if(!rawId) return;

        // URL से मिली आईडी को साफ़ करें
        const searchIdClean = cleanID(decodeURIComponent(rawId));
        document.getElementById('disp_id').value = decodeURIComponent(rawId);

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/);
            let found = false;

            for(let i = 1; i < rows.length; i++) {
                if(!rows[i].trim()) continue;

                const cols = parseCSVRow(rows[i]);
                const csvIdClean = cleanID(cols[0]);

                // मिलान करें
                if(csvIdClean === searchIdClean) {
                    document.getElementById('disp_ward').value = cols[1] || "N/A";
                    document.getElementById('disp_name').value = cols[2] || "N/A";
                    document.getElementById('disp_mobile').value = cols[5] || "---";
                    document.getElementById('disp_curr').value = "₹ " + (cols[6] || "0");
                    document.getElementById('disp_arr').value = "₹ " + (cols[7] || "0");
                    document.getElementById('disp_total').value = "₹ " + (cols[8] || "0");
                    found = true;
                    break;
                }
            }

            if (!found) {
                alert("डाटा नहीं मिला! कृपया आईडी चेक करें।");
            }
        } catch(e) {
            console.error("Error loading CSV:", e);
        }
    }

    function goToEdit() {
        const pass = prompt("पासवर्ड डालें:");
        if (pass === "admin123") {
            const id = encodeURIComponent(document.getElementById('disp_id').value);
            window.location.href = "edit_connection.html?id=" + id;
        } else if (pass !== null) {
            alert("गलत पासवर्ड!");
        }
    }

    function handleDelete() {
        const pass = prompt("हटाने के लिए पासवर्ड डालें:");
        if (pass === "admin123") {
            if(confirm("क्या आप वाकई हटाना चाहते हैं?")) {
                alert("रिकॉर्ड हटाया गया (Demo)");
                window.location.href = "connection_detail.html";
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
