<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>उपभोक्ता विवरण - NPP नकुड़</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; 
        }

        body {
            background: linear-gradient(135deg, #f8f4e8 0%, #fff8ee 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 195, 113, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(113, 188, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .main-card {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(145deg, #ffffff 0%, #fffbf2 100%);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 
                0 20px 60px rgba(255, 140, 0, 0.1),
                0 8px 30px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 200, 100, 0.3);
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        .main-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff8c00, #ffc400, #ff8c00);
            border-radius: 25px 25px 0 0;
        }

        /* Header Design */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(255, 182, 77, 0.2);
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 140, 0, 0.3), transparent);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .logo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #ff8c00, #ffcc00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 10px 30px rgba(255, 140, 0, 0.3),
                inset 0 4px 10px rgba(255, 255, 255, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.8);
            animation: logoGlow 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { box-shadow: 0 10px 30px rgba(255, 140, 0, 0.3); }
            100% { box-shadow: 0 10px 40px rgba(255, 140, 0, 0.5); }
        }

        .logo-circle img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .logo-text {
            flex: 1;
        }

        .logo-text h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #cc6600, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            color: #666;
            font-size: 15px;
            font-weight: 500;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fff, #fff9f0);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff8c00;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 20px;
            border: 1px solid rgba(255, 182, 77, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #ff8c00, #ffaa00);
            color: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 140, 0, 0.3);
            border-color: transparent;
        }

        /* Data Grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .input-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-item label {
            font-size: 13px;
            font-weight: 600;
            color: #ff8c00;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-item label i {
            font-size: 14px;
        }

        .input-item input {
            padding: 18px 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 182, 77, 0.2);
            background: linear-gradient(135deg, #fffcf5, #fff9ee);
            font-size: 16px;
            font-weight: 600;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .input-item input:focus {
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
            background: #fff;
        }

        .input-item input:disabled {
            background: #f9f9f9;
            color: #555;
            cursor: not-allowed;
        }

        /* Money Section */
        .money-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 25px 0;
            padding: 30px;
            background: linear-gradient(135deg, #fff9ef, #fff5e5);
            border-radius: 20px;
            border: 2px dashed rgba(255, 140, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .money-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .money-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.1);
            border: 1px solid rgba(255, 182, 77, 0.2);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .money-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 140, 0, 0.15);
        }

        .money-card label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            display: block;
        }

        .money-card input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 24px;
            font-weight: 700;
            color: #ff8c00;
            outline: none;
        }

        .total-box {
            background: linear-gradient(135deg, #ff8c00, #ffcc00);
            border: none;
        }

        .total-box label {
            color: rgba(255, 255, 255, 0.9);
        }

        .total-box input {
            color: white !important;
            font-size: 28px !important;
        }

        /* Toolbar */
        .toolbar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 182, 77, 0.2);
            position: relative;
        }

        .toolbar::before {
            content: "कार्रवाई";
            position: absolute;
            top: -12px;
            left: 0;
            background: white;
            padding: 0 15px;
            color: #ff8c00;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .icon-circle::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .icon-circle:hover::before {
            opacity: 1;
        }

        .btn-print { 
            background: linear-gradient(135deg, #6c757d, #868e96); 
            color: white; 
        }
        .btn-pay { 
            background: linear-gradient(135deg, #28a745, #20c997); 
            color: white; 
        }
        .btn-edit { 
            background: linear-gradient(135deg, #ff8c00, #ffc107); 
            color: white; 
        }
        .btn-delete { 
            background: linear-gradient(135deg, #ffffff, #f8f9fa); 
            color: #dc3545; 
            border: 2px solid #ffcccc; 
        }

        .icon-circle:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .main-card {
                padding: 20px;
                border-radius: 20px;
            }
            
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .logo-container {
                flex-direction: column;
                text-align: center;
            }
            
            .logo-wrapper {
                margin: 0 auto;
            }
            
            .details-grid, .money-section {
                grid-template-columns: 1fr;
            }
            
            .toolbar {
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .icon-circle {
                width: 55px;
                height: 55px;
                font-size: 20px;
            }
            
            .logo-text h1 {
                font-size: 24px;
            }
        }

        /* Animation for elements */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-item, .money-card, .icon-circle {
            animation: fadeInUp 0.5s ease forwards;
        }

        .input-item:nth-child(1) { animation-delay: 0.1s; }
        .input-item:nth-child(2) { animation-delay: 0.2s; }
        .input-item:nth-child(3) { animation-delay: 0.3s; }
        .input-item:nth-child(4) { animation-delay: 0.4s; }
        .money-card:nth-child(1) { animation-delay: 0.5s; }
        .money-card:nth-child(2) { animation-delay: 0.6s; }
        .money-card:nth-child(3) { animation-delay: 0.7s; }
        .icon-circle:nth-child(1) { animation-delay: 0.8s; }
        .icon-circle:nth-child(2) { animation-delay: 0.9s; }
        .icon-circle:nth-child(3) { animation-delay: 1.0s; }
        .icon-circle:nth-child(4) { animation-delay: 1.1s; }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <div class="logo-container">
                <div class="logo-wrapper">
                    <div class="logo-circle">
                        <img src="img1.png" alt="NPP नकुड़ लोगो" 
                             onerror="this.onerror=null; this.src='https://img.icons8.com/color/96/000000/water.png'">
                    </div>
                </div>
                <div class="logo-text">
                    <h1>उपभोक्ता विवरण</h1>
                    <p>नगर पालिका परिषद नकुड़ - जल आपूर्ति विभाग</p>
                </div>
            </div>
            
            <div class="nav-buttons">
                <a href="https://nppnakur.github.io/connection_detail.html" class="nav-btn" title="वापस सूची पर">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <a href="https://nppnakur.github.io/water_manegment.html" class="nav-btn" title="होम पेज">
                    <i class="fas fa-home"></i>
                </a>
                <a href="#" class="nav-btn" title="सहायता" onclick="alert('सहायता के लिए कॉल करें: 1800-XXX-XXXX')">
                    <i class="fas fa-question-circle"></i>
                </a>
            </div>
        </header>

        <div class="details-grid">
            <div class="input-item" style="grid-column: 1 / -1;">
                <label><i class="fas fa-id-card"></i> कनेक्शन आईडी</label>
                <input type="text" id="disp_id" disabled placeholder="कनेक्शन आईडी लोड हो रहा है...">
            </div>
            
            <div class="input-item">
                <label><i class="fas fa-user"></i> उपभोक्ता का नाम</label>
                <input type="text" id="disp_name" disabled placeholder="नाम">
            </div>
            
            <div class="input-item">
                <label><i class="fas fa-map-marker-alt"></i> वार्ड नं. / नाम</label>
                <input type="text" id="disp_ward" disabled placeholder="वार्ड">
            </div>
            
            <div class="input-item" style="grid-column: 1 / -1;">
                <label><i class="fas fa-phone"></i> मोबाइल नंबर</label>
                <input type="text" id="disp_mobile" disabled placeholder="मोबाइल नंबर">
            </div>

            <div class="money-section">
                <div class="money-card">
                    <label><i class="fas fa-file-invoice-dollar"></i> चालू मांग</label>
                    <input type="text" id="disp_curr" disabled value="₹ 0">
                </div>
                
                <div class="money-card">
                    <label><i class="fas fa-history"></i> बकाया राशि</label>
                    <input type="text" id="disp_arr" disabled value="₹ 0">
                </div>
                
                <div class="money-card total-box">
                    <label><i class="fas fa-rupee-sign"></i> कुल देय राशि</label>
                    <input type="text" id="disp_total" disabled value="₹ 0">
                </div>
            </div>

            <div class="toolbar">
                <button class="icon-circle btn-print" title="प्रिंट करें" onclick="window.print()">
                    <i class="fas fa-print"></i>
                </button>
                <button class="icon-circle btn-pay" title="बिल भुगतान" onclick="location.href='https://nppnakur.github.io/pay_bill.html'">
                    <i class="fas fa-file-invoice-dollar"></i>
                </button>
                <button class="icon-circle btn-edit" title="संपादित करें" onclick="goToEdit()">
                    <i class="fas fa-pencil-alt"></i>
                </button>
                <button class="icon-circle btn-delete" title="हटाएं" onclick="handleDelete()">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    // ID से विशेष characters हटाने का फंक्शन
    function cleanID(id) {
        if (!id) return "";
        // सभी quotes, commas और extra spaces को हटाएं
        return id.replace(/["',]/g, '').replace(/\s+/g, ' ').trim();
    }

    // CSV row को columns में बदलने का बेहतर तरीका
    function parseCSVRow(row) {
        const result = [];
        let current = "";
        let inQuotes = false;
        
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            const nextChar = row[i + 1];
            
            if (char === '"' && inQuotes && nextChar === '"') {
                current += '"';
                i++; // Skip next quote
            } else if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = "";
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get('id'); 
        
        if(!rawId) {
            console.log("No ID parameter found");
            document.getElementById('disp_id').placeholder = "कृपया वैध कनेक्शन आईडी चुनें";
            return;
        }

        const originalId = decodeURIComponent(rawId);
        document.getElementById('disp_id').value = originalId;
        
        // Clean the search ID for comparison
        const searchIdClean = cleanID(originalId);
        console.log("Searching for cleaned ID:", searchIdClean);

        try {
            const res = await fetch('Connection_data.csv');
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            
            const text = await res.text();
            const rows = text.split(/\r?\n/);
            
            console.log("Total rows in CSV:", rows.length);
            let found = false;

            for(let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if(!row.trim()) continue;

                // Use the improved CSV parser
                const cols = parseCSVRow(row);
                
                if(cols.length >= 1 && cols[0]) {
                    const csvIdClean = cleanID(cols[0]);
                    console.log(`Row ${i}: Checking CSV ID "${csvIdClean}" against "${searchIdClean}"`);
                    
                    // Exact match करने की कोशिश करें
                    if(searchIdClean === csvIdClean) {
                        console.log("Match found at row", i);
                        
                        // Data fill करें (CSV columns के अनुसार)
                        document.getElementById('disp_name').value = cols[2] ? cols[2].replace(/"/g, '').trim() : "";
                        document.getElementById('disp_ward').value = cols[1] ? cols[1].replace(/"/g, '').trim() : "निर्धारित नहीं";
                        document.getElementById('disp_mobile').value = cols[5] ? cols[5].replace(/"/g, '').trim() : "---";
                        document.getElementById('disp_curr').value = "₹ " + (cols[6] ? cols[6].replace(/"/g, '').trim() : "0");
                        document.getElementById('disp_arr').value = "₹ " + (cols[7] ? cols[7].replace(/"/g, '').trim() : "0");
                        document.getElementById('disp_total').value = "₹ " + (cols[8] ? cols[8].replace(/"/g, '').trim() : "0");
                        
                        found = true;
                        
                        // Logo के लिए custom styling
                        const logoImg = document.querySelector('.logo-circle img');
                        if (logoImg.src.includes('icons8.com')) {
                            // Custom logo styling if default icon is used
                            logoImg.style.border = "3px solid white";
                            logoImg.style.boxShadow = "0 0 20px rgba(255, 140, 0, 0.5)";
                        }
                        
                        break;
                    }
                }
            }
            
            if (!found) {
                console.log("No match found for ID:", searchIdClean);
                document.getElementById('disp_name').placeholder = "डेटा उपलब्ध नहीं";
                document.getElementById('disp_ward').placeholder = "डेटा उपलब्ध नहीं";
                document.getElementById('disp_mobile').placeholder = "डेटा उपलब्ध नहीं";
                
                const errorDiv = document.createElement('div');
                errorDiv.innerHTML = `
                    <div style="background: #fff3cd; color: #856404; padding: 15px; border-radius: 10px; 
                                margin: 20px 0; border-left: 4px solid #ffc107; animation: fadeInUp 0.5s ease;">
                        <i class="fas fa-exclamation-triangle" style="margin-right: 10px;"></i>
                        <strong>चेतावनी:</strong> उपभोक्ता का डेटा नहीं मिला। कृपया सही कनेक्शन आईडी जांचें।
                    </div>
                `;
                document.querySelector('.details-grid').insertBefore(errorDiv, document.querySelector('.money-section'));
            }
            
        } catch(e) { 
            console.log("Fetch Error", e);
            
            const errorDiv = document.createElement('div');
            errorDiv.innerHTML = `
                <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 10px; 
                            margin: 20px 0; border-left: 4px solid #dc3545; animation: fadeInUp 0.5s ease;">
                    <i class="fas fa-exclamation-circle" style="margin-right: 10px;"></i>
                    <strong>त्रुटि:</strong> CSV फाइल लोड करने में समस्या: ${e.message}
                </div>
            `;
            document.querySelector('.details-grid').insertBefore(errorDiv, document.querySelector('.money-section'));
        }
    }

    function goToEdit() {
        const pass = prompt("संपादन के लिए पासवर्ड डालें:");
        if (pass === "admin123") {
            const id = encodeURIComponent(document.getElementById('disp_id').value);
            window.location.href = "edit_connection.html?id=" + id;
        } else if (pass !== null) {
            alert("गलत पासवर्ड! संपादन के लिए 'admin123' दर्ज करें।");
        }
    }

    function handleDelete() {
        const pass = prompt("रिकॉर्ड हटाने के लिए पासवर्ड डालें:");
        if (pass === "admin123") {
            if(confirm("⚠️ क्या आप वाकई इस रिकॉर्ड को स्थायी रूप से हटाना चाहते हैं?\n\nयह कार्रवाई पूर्ववत नहीं की जा सकती।")) {
                alert("रिकॉर्ड हटा दिया गया। (डेमो के लिए - वास्तविक डिलीट नहीं किया गया)");
                window.location.href = "https://nppnakur.github.io/connection_detail.html";
            }
        } else if (pass !== null) {
            alert("गलत पासवर्ड! हटाने के लिए 'admin123' दर्ज करें।");

    }

    // Add logo loading error handler
    document.addEventListener('DOMContentLoaded', function() {
        const logoImg = document.querySelector('.logo-circle img');
        if (logoImg) {
            logoImg.onerror = function() {
                this.src = 'https://img.icons8.com/color/96/000000/water.png';
                this.style.border = "3px solid white";
                this.style.boxShadow = "0 0 20px rgba(0, 123, 255, 0.5)";
            };
        }
        
        // Initialize with slight delay for better UX
        setTimeout(init, 300);
    });

    // Add some interactive effects
    document.querySelectorAll('.input-item input').forEach(input => {
        input.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-2px)';
        });
        input.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
        });
    });
</script>
