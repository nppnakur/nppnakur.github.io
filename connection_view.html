<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #fffaf0; 
            color: #4a3728;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(255, 165, 0, 0.1);
            border: 1px solid #ffe4b5;
        }

        /* Header Layout: Logo Left, Buttons Right */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #fff5e6;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-left img { width: 70px; height: 70px; border-radius: 10px; }
        .header-left h1 { font-size: 24px; font-weight: 800; color: #cc7a00; }

        .header-right { display: flex; gap: 12px; }
        .nav-btn {
            width: 45px; height: 45px; background: #fff5e6; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #ffa500; text-decoration: none; transition: 0.3s; font-size: 18px;
            border: 1px solid #ffe4b5;
        }
        .nav-btn:hover { background: #ffa500; color: #fff; transform: translateY(-3px); }

        /* Data Grid */
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .input-item { display: flex; flex-direction: column; gap: 8px; }
        .input-item label { font-size: 12px; font-weight: 700; color: #805500; text-transform: uppercase; }
        .input-item input {
            padding: 16px; border-radius: 15px; border: 1px solid #ffe4b5;
            background: #fffcf5; font-size: 16px; font-weight: 600; color: #4a3728; outline: none;
        }

        /* Money Section */
        .money-section {
            grid-column: 1 / -1;
            display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px;
            margin-top: 15px; background: #fff9ef; padding: 25px; border-radius: 20px;
            border: 1px dashed #ffa500;
        }
        .money-card input { width: 100%; border: none; background: transparent; font-size: 22px; font-weight: 800; color: #cc7a00; }
        
        .total-box { background: #ffa500; padding: 15px; border-radius: 15px; }
        .total-box label { color: #fff; }
        .total-box input { color: #fff !important; font-size: 26px !important; }

        /* Toolbar Bottom */
        .toolbar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #fff5e6;
        }

        .icon-circle {
            width: 55px; height: 55px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .btn-print { background: #6c757d; color: #fff; }
        .btn-pay { background: #28a745; color: #fff; }
        .btn-edit { background: #ffa500; color: #fff; }
        .btn-delete { background: #fff; color: #dc3545; border: 1px solid #ffcccc; }

        .icon-circle:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

        @media (max-width: 650px) {
            .details-grid, .money-section { grid-template-columns: 1fr; }
            .header { flex-direction: column-reverse; text-align: center; gap: 15px; }
            .header-left { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <div class="header-left">
                <img src="img1.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1067/1067566.png'">
                <div>
                    <h1>उपभोक्ता विवरण</h1>
                    <p>न.पा.प. नकुड़ - जल विभाग</p>
                </div>
            </div>
            
            <div class="header-right">
                <a href="https://nppnakur.github.io/connection_detail.html" class="nav-btn" title="वापस सूची पर">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <a href="https://nppnakur.github.io/water_manegment.html" class="nav-btn" title="होम पेज">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </header>

        <div class="details-grid">
            <div class="input-item" style="grid-column: 1 / -1;">
                <label>Connection ID</label>
                <input type="text" id="disp_id" disabled>
            </div>
            <div class="input-item">
                <label>उपभोक्ता का नाम</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="input-item">
                <label>वार्ड नं. / नाम</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            <div class="input-item" style="grid-column: 1 / -1;">
                <label>मोबाइल नंबर</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="money-section">
                <div class="money-card">
                    <label>चालू मांग</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="money-card">
                    <label>बकाया</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="money-card total-box">
                    <label>कुल देय</label>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="toolbar">
                <button class="icon-circle btn-print" title="Print" onclick="window.print()">
                    <i class="fas fa-print"></i>
                </button>
                <button class="icon-circle btn-pay" title="Pay Bill" onclick="location.href='https://nppnakur.github.io/pay_bill.html'">
                    <i class="fas fa-file-invoice-dollar"></i>
                </button>
                <button class="icon-circle btn-edit" title="Edit" onclick="goToEdit()">
                    <i class="fas fa-pencil-alt"></i>
                </button>
                <button class="icon-circle btn-delete" title="Delete" onclick="handleDelete()">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    // ID से विशेष characters हटाने का फंक्शन
    function cleanID(id) {
        if (!id) return "";
        // सभी quotes, commas और extra spaces को हटाएं
        return id.replace(/["',]/g, '').replace(/\s+/g, ' ').trim();
    }

    // CSV row को columns में बदलने का बेहतर तरीका
    function parseCSVRow(row) {
        const result = [];
        let current = "";
        let inQuotes = false;
        
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            const nextChar = row[i + 1];
            
            if (char === '"' && inQuotes && nextChar === '"') {
                current += '"';
                i++; // Skip next quote
            } else if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = "";
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get('id'); 
        
        if(!rawId) {
            console.log("No ID parameter found");
            return;
        }

        const originalId = decodeURIComponent(rawId);
        document.getElementById('disp_id').value = originalId;
        
        // Clean the search ID for comparison
        const searchIdClean = cleanID(originalId);
        console.log("Searching for cleaned ID:", searchIdClean);

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/);
            
            console.log("Total rows in CSV:", rows.length);

            for(let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if(!row.trim()) continue;

                // Use the improved CSV parser
                const cols = parseCSVRow(row);
                
                if(cols.length >= 1 && cols[0]) {
                    const csvIdClean = cleanID(cols[0]);
                    console.log("Checking CSV ID:", csvIdClean);
                    
                    // Exact match करने की कोशिश करें
                    if(searchIdClean === csvIdClean) {
                        console.log("Match found! Filling data...");
                        
                        // Data fill करें (CSV columns के अनुसार)
                        document.getElementById('disp_name').value = cols[2] ? cols[2].replace(/"/g, '').trim() : "";
                        document.getElementById('disp_ward').value = cols[1] ? cols[1].replace(/"/g, '').trim() : "N/A";
                        document.getElementById('disp_mobile').value = cols[5] ? cols[5].replace(/"/g, '').trim() : "---";
                        document.getElementById('disp_curr').value = "₹ " + (cols[6] ? cols[6].replace(/"/g, '').trim() : "0");
                        document.getElementById('disp_arr').value = "₹ " + (cols[7] ? cols[7].replace(/"/g, '').trim() : "0");
                        document.getElementById('disp_total').value = "₹ " + (cols[8] ? cols[8].replace(/"/g, '').trim() : "0");
                        
                        console.log("Data filled successfully");
                        return;
                    }
                }
            }
            
            console.log("No match found for ID:", searchIdClean);
            alert("उपभोक्ता का डेटा नहीं मिला।");
            
        } catch(e) { 
            console.log("Fetch Error", e);
            alert("CSV फाइल लोड करने में त्रुटि: " + e.message);
        }
    }

    function goToEdit() {
        const pass = prompt("पासवर्ड डालें:");
        if (pass === "admin123") {
            const id = encodeURIComponent(document.getElementById('disp_id').value);
            window.location.href = "edit_connection.html?id=" + id;
        } else if (pass !== null) {
            alert("गलत पासवर्ड!");
        }
    }

    function handleDelete() {
        const pass = prompt("डिलीट पासवर्ड:");
        if (pass === "admin123") {
            if(confirm("क्या आप वाकई इस रिकॉर्ड को डिलीट करना चाहते हैं?")) {
                window.location.href = "https://nppnakur.github.io/connection_detail.html";
            }
        } else if (pass !== null) {
            alert("गलत पासवर्ड!");
        }
    }

    window.onload = init;
</script>
</body>
</html>
