<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #f4f7fe;
            color: #2b3674;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-card {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            position: relative;
        }

        /* Top Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left img {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.05);
            border: 2px solid #fff;
        }

        .header-left h1 { font-size: 28px; font-weight: 800; color: #1b2559; }
        .header-left p { font-size: 14px; color: #a3aed0; font-weight: 500; }

        .home-btn {
            width: 50px;
            height: 50px;
            background: #f4f7fe;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4318ff;
            text-decoration: none;
            transition: 0.3s;
        }
        .home-btn:hover { background: #4318ff; color: #fff; transform: translateY(-3px); }

        /* Data Grid Layout */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .input-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-item label { font-size: 13px; font-weight: 700; color: #1b2559; margin-left: 5px; }
        
        .input-item input {
            padding: 18px;
            border-radius: 20px;
            border: 1px solid #e0e5f2;
            background: #fff;
            font-size: 16px;
            font-weight: 600;
            color: #2b3674;
            transition: 0.3s;
        }

        .input-item input:focus { border-color: #4318ff; outline: none; box-shadow: 0 10px 20px rgba(67, 24, 255, 0.05); }

        /* Money Cards (Horizontal Row) */
        .money-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 20px;
            margin-top: 20px;
        }

        .money-card {
            padding: 25px;
            border-radius: 25px;
            text-align: left;
            position: relative;
            overflow: hidden;
            border: 1px solid #e0e5f2;
        }

        .money-card label { font-size: 11px; color: #a3aed0; font-weight: 800; text-transform: uppercase; }
        .money-card input { 
            width: 100%; border: none !important; background: transparent !important; 
            font-size: 24px !important; font-weight: 800 !important; color: #1b2559 !important;
            margin-top: 5px;
        }

        /* Specialized Colors */
        .money-card.current { border-left: 6px solid #4318ff; background: #f4f7fe; }
        .money-card.arrears { border-left: 6px solid #ffb547; background: #fffcf5; }
        .money-card.total { background: #4318ff; }
        .money-card.total label { color: rgba(255,255,255,0.7); }
        .money-card.total input { color: #fff !important; font-size: 30px !important; }

        /* Buttons Area */
        .footer-btns {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 18px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-edit { background: #2b3674; color: #fff; }
        .btn-print { background: #e0e5f2; color: #2b3674; }
        .btn-save { background: #05cd99; color: #fff; display: none; }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        @media (max-width: 800px) {
            .details-grid, .money-section { grid-template-columns: 1fr; }
            .main-card { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="header">
            <div class="header-left">
                <img src="img1.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1067/1067566.png'">
                <div>
                    <h1>Consumer Detail</h1>
                    <p>न.पा.प. नकुड़ - जल विभाग</p>
                </div>
            </div>
            <a href="connection_detail.html" class="home-btn" title="Home"><i class="fas fa-home"></i></a>
        </header>

        <div class="details-grid">
            <div class="input-item">
                <label>Connection ID</label>
                <input type="text" id="disp_id" disabled>
            </div>
            <div class="input-item">
                <label>Consumer Name</label>
                <input type="text" id="disp_name" disabled>
            </div>
            <div class="input-item">
                <label>Ward Name / No.</label>
                <input type="text" id="disp_ward" disabled>
            </div>
            <div class="input-item">
                <label>Mobile Number</label>
                <input type="text" id="disp_mobile" disabled>
            </div>

            <div class="money-section">
                <div class="money-card current">
                    <label>चालू मांग (2025-2026)</label>
                    <input type="text" id="disp_curr" disabled>
                </div>
                <div class="money-card arrears">
                    <label>बकाया (2024-2025)</label>
                    <input type="text" id="disp_arr" disabled>
                </div>
                <div class="money-card total">
                    <label>कुल देय राशि (Total)</label>
                    <input type="text" id="disp_total" disabled>
                </div>
            </div>

            <div class="footer-btns">
                <button id="saveBtn" class="btn btn-save" onclick="saveData()"><i class="fas fa-save"></i> UPDATE</button>
                <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> PRINT</button>
                <button class="btn btn-edit" id="editBtn" onclick="enableEdit()"><i class="fas fa-user-edit"></i> EDIT INFO</button>
            </div>
        </div>
    </div>

<script>
    // Fix for special IDs like Baljeet Singh (1,191)
    function cleanID(id) {
        if(!id) return "";
        return decodeURIComponent(id).replace("NPPNCN-", "").replace(/[",\s]/g, "").trim();
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        let rawId = params.get('id');
        if(!rawId) return;

        let searchKey = cleanID(rawId);

        try {
            const res = await fetch('Connection_data.csv');
            const text = await res.text();
            const rows = text.split(/\r?\n/).slice(1);

            for(let row of rows) {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(!cols[0]) continue;

                if(cleanID(cols[0]) === searchKey) {
                    document.getElementById('disp_id').value = "NPPNCN-" + cols[0].replace(/"/g, '');
                    document.getElementById('disp_name').value = (cols[2] + " " + (cols[3] || "")).replace(/"/g, '').trim();
                    document.getElementById('disp_ward').value = cols[1] ? cols[1].replace(/"/g, '') : "---";
                    document.getElementById('disp_mobile').value = cols[5] ? cols[5].replace(/"/g, '') : "---";
                    document.getElementById('disp_curr').value = "₹" + (cols[6] || "0");
                    document.getElementById('disp_arr').value = "₹" + (cols[7] || "0");
                    document.getElementById('disp_total').value = "₹" + (cols[8] || "0");
                    return;
                }
            }
        } catch(e) { console.error("Loading error"); }
    }

    function enableEdit() {
        if(prompt("Enter Admin Password:") === "admin123") {
            document.querySelectorAll('input').forEach(i => { if(i.id !== 'disp_id') i.disabled = false; });
            document.getElementById('saveBtn').style.display = 'flex';
            document.getElementById('editBtn').style.display = 'none';
        }
    }

    function saveData() { alert("Updated Successfully!"); location.reload(); }

    window.onload = init;
</script>
</body>
</html>
