<!DOCTYPE html>
<html>
<head>
    <title>Add Connection Detail</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f4f4; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Add Detail</h2>
        <input type="text" id="id" placeholder="ID (NPPNCN-161218)">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="amount" placeholder="Amount (600)">
        <button onclick="sendData()">Submit Data</button>
        <p id="msg"></p>
    </div>

    <script>
        const WEB_APP_URL = "आपका_URL_यहाँ_डालें";

        function sendData() {
            const id = document.getElementById('id').value;
            const name = document.getElementById('name').value;
            const amt = document.getElementById('amount').value;
            const data = `${id},${name},${amt}`;

            document.getElementById('msg').innerText = "भेजा जा रहा है...";
            
            const script = document.createElement('script');
            script.src = `${WEB_APP_URL}?action=add&data=${encodeURIComponent(data)}&callback=res`;
            document.body.appendChild(script);
        }

        function res(response) {
            document.getElementById('msg').innerText = "सफलतापूर्वक जुड़ गया!";
        }
    </script>
</body>
</html>
