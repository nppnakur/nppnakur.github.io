<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection View - All Records</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #3498db; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        .loader { text-align: center; font-weight: bold; color: #3498db; margin: 20px; }
        .refresh-btn { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right; }
    </style>
</head>
<body>

<div class="container">
    <button class="refresh-btn" onclick="fetchAllData()">Refresh Data</button>
    <h2>Connection List (Google Sheet Data)</h2>
    
    <div id="loader" class="loader">डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...</div>
    
    <table id="dataTable" style="display:none;">
        <thead>
            <tr id="tableHeader">
                </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    // आपका Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbw13i2xcY7V76iwupb_iGV-Ri0W0v-cg-C1yybS9IXwBY4U80JVZ0LGnYVBDFwqo5KDVg/exec";

    // पेज लोड होते ही डेटा लाओ
    window.onload = fetchAllData;

    function fetchAllData() {
        const loader = document.getElementById('loader');
        const table = document.getElementById('dataTable');
        const tableBody = document.getElementById('tableBody');
        const tableHeader = document.getElementById('tableHeader');

        loader.style.display = "block";
        table.style.display = "none";
        tableBody.innerHTML = "";
        tableHeader.innerHTML = "";

        // 'readAll' एक्शन के लिए कॉल (हम script में एक छोटा बदलाव करेंगे)
        // फिलहाल हम read action को बिना ID के भेजेंगे ताकि वो सब दिखाए (अगर script support करे)
        // वरना हमें Apps Script में readAll का function डालना होगा।
        
        const script = document.createElement('script');
        script.src = `${API_URL}?action=readAll&callback=displayData`;
        document.body.appendChild(script);
    }

    function displayData(data) {
        const loader = document.getElementById('loader');
        const table = document.getElementById('dataTable');
        const tableBody = document.getElementById('tableBody');
        const tableHeader = document.getElementById('tableHeader');

        loader.style.display = "none";

        if (!data || data.length === 0) {
            loader.innerText = "कोई डेटा नहीं मिला!";
            loader.style.display = "block";
            return;
        }

        // 1. टेबल हेडर बनाएँ (पहली Row से)
        const headers = ["ID", "Name", "Details", "Status"]; // आप अपनी शीट के हिसाब से बदलें
        headers.forEach(h => {
            let th = document.createElement('th');
            th.innerText = h;
            tableHeader.appendChild(th);
        });

        // 2. डेटा रोज़ (Rows) भरें
        data.forEach((row, index) => {
            if(index === 0) return; // Header row को छोड़ दें अगर वो डेटा में है
            let tr = document.createElement('tr');
            row.forEach(cell => {
                let td = document.createElement('td');
                td.innerText = cell;
                tableHeader.appendChild(td); // Safe side filling
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });

        table.style.display = "table";
    }
</script>

</body>
</html>
