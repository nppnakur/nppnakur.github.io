<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Detail - NPP NAKUR</title>
    
    <link rel="icon" type="image/png" href="img1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #1e3a8a;
            --bg-page: #f1f5f9; 
            --card-bg: #ffffff; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body { 
            background-color: var(--bg-page); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 280px; 
            gap: 20px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #cbd5e1;
        }

        .header-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 10px;
        }

        .logo-section { display: flex; align-items: center; gap: 15px; }
        .logo-section img { width: 60px; height: 60px; border-radius: 10px; border: 1px solid var(--primary); }

        .info-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        .data-box {
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .data-box label { display: block; font-size: 11px; color: #64748b; font-weight: 800; text-transform: uppercase; }
        .data-box input { background: transparent; border: none; color: #1e293b; font-size: 16px; font-weight: 700; width: 100%; outline: none; margin-top: 4px; }

        .money-row { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 15px; margin-top: 10px; }
        .total-box { background: #fff1f2; border-color: #fecaca; }
        .total-box input { color: #be123b; font-size: 22px; font-weight: 900; }

        .action-panel { display: flex; flex-direction: column; gap: 12px; }
        .btn { padding: 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .btn-pay { background: var(--primary); color: white; }
        .btn-edit { background: white; color: var(--primary); border: 2px solid var(--primary); }
        .btn-delete { background: #fee2e2; color: #b91c1c; }

        #saveBtn { display: none; background: #10b981; color: white; width: 100%; margin-top: 10px; }

        @media (max-width: 850px) { .dashboard { grid-template-columns: 1fr; } .money-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-panel">
        <div class="logo-section">
            <img src="img1.png" alt="Logo">
            <div>
                <h2 style="color: var(--primary);">उपभोक्ता विवरण</h2>
                <p style="color: #64748b; font-size: 12px;">न.पा.प. नकुड़ (सहारनपुर)</p>
            </div>
        </div>
        <span style="background: #dcfce7; color: #166534; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800;">LIVE DATA</span>
    </div>

    <div class="info-panel">
        <div class="data-box"><label>उपभोक्ता ID</label><input type="text" id="disp_id" disabled></div>
        <div class="data-box"><label>नाम</label><input type="text" id="disp_name" disabled></div>
        <div class="data-box"><label>वार्ड</label><input type="text" id="disp_ward" disabled></div>
        <div class="data-box"><label>मोबाइल</label><input type="text" id="disp_mobile" disabled></div>

        <div class="money-row">
            <div class="data-box"><label>चालू मांग</label><input type="text" id="disp_curr" disabled></div>
            <div class="data-box"><label>बकाया</label><input type="text" id="disp_arr" disabled></div>
            <div class="data-box total-box"><label>कुल देय</label><input type="text" id="disp_total" disabled></div>
        </div>
        <button id="saveBtn" class="btn" onclick="saveData()">Update Record</button>
    </div>

    <div class="action-panel">
        <button class="btn btn-pay" onclick="alert('Redirecting...')"><i class="fas fa-rupee-sign"></i> PAY NOW</button>
        <button class="btn btn-edit" id="editBtn" onclick="enableEdit()"><i class="fas fa-edit"></i> EDIT</button>
        <button class="btn" style="background:#f1f5f9" onclick="window.print()"><i class="fas fa-print"></i> PRINT</button>
        <button class="btn btn-delete" onclick="handleDelete()"><i class="fas fa-trash"></i> DELETE</button>
    </div>
</div>

<script>
    // कोमा वाली ID को क्लीन करने का फंक्शन
    function superClean(str) {
        if(!str) return "";
        return decodeURIComponent(str).replace("NPPNCN-", "").replace(/[",\s]/g, "").trim();
    }

    async function load() {
        const urlParams = new URLSearchParams(window.location.search);
        let rawId = urlParams.get('id');
        if(!rawId) return;

        let searchId = superClean(rawId);

        // 1. LocalStorage Check
        const local = JSON.parse(localStorage.getItem('newConnections') || '[]');
        let data = local.find(i => superClean(i.id) === searchId);

        if(data) {
            render(data);
        } else {
            // 2. CSV Check
            try {
                const res = await fetch('Connection_data.csv');
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1);

                for(let row of rows) {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(!cols[0]) continue;

                    if(superClean(cols[0]) === searchId) {
                        render({
                            id: `NPPNCN-${cols[0].replace(/"/g, '')}`,
                            ward: cols[1] || "---",
                            name: (cols[2] + " " + (cols[3] || "") + " " + (cols[4] || "")).replace(/"/g, '').trim(),
                            mobile: cols[5] || "N/A",
                            curr: cols[6] || "0",
                            arr: cols[7] || "0",
                            total: cols[8] || "0"
                        });
                        return;
                    }
                }
            } catch(e) { console.error("CSV error"); }
        }
    }

    function render(d) {
        document.getElementById('disp_id').value = d.id;
        document.getElementById('disp_name').value = d.name;
        document.getElementById('disp_ward').value = d.ward;
        document.getElementById('disp_mobile').value = d.mobile;
        document.getElementById('disp_curr').value = "₹" + d.curr;
        document.getElementById('disp_arr').value = "₹" + d.arr;
        document.getElementById('disp_total').value = "₹" + d.total;
    }

    function enableEdit() {
        if(prompt("Admin Password:") === "admin123") {
            document.querySelectorAll('input').forEach(i => { if(i.id !== 'disp_id') i.disabled = false; });
            document.getElementById('saveBtn').style.display = 'block';
            document.getElementById('editBtn').style.display = 'none';
        }
    }

    function saveData() { alert("Updated!"); location.reload(); }

    function handleDelete() {
        if(prompt("Password:") === "admin123") {
            if(confirm("Delete this?")) {
                let local = JSON.parse(localStorage.getItem('newConnections') || '[]');
                let currentId = superClean(document.getElementById('disp_id').value);
                let updated = local.filter(i => superClean(i.id) !== currentId);
                localStorage.setItem('newConnections', JSON.stringify(updated));
                window.location.href = "connection_detail.html";
            }
        }
    }

    window.onload = load;
</script>
</body>
</html>
